name: Notify Main Repo

on:
  push:
    branches:
      - main

jobs:
  ping-repo-b:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Localisation Repo Workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            https://api.github.com/repos/GTSRA/gtsra/dispatches \
            -d '{"event_type": "localisation_updated"}'

  gts_leader_bruh.0023.b: "Ignore this strange creature"
  #  Colin很懶，這裡什麼都沒有(如果你有什麼文案想法就連絡Colin吧)\n\n總之有小人被巨娘UB並被轉化成巨娘了
  gts_leader_bruh.0101.desc: "Colin is lazy and there's nothing here (contact Colin if you have any copywriting ideas).\\n\\nAnyway, a tiny was UB'd by a giantess and transformed into a giantess."
  #  §R好哦§!
  gts_leader_bruh.0101.a: "§ROkay§!"
  #  §G好哦§!
  gts_leader_bruh.0101.b: "§GOkay§!"
  #  §Y好哦§!
  gts_leader_bruh.0101.c: "§YOkay§!"
  #  這是測試用的選項§R(你不應該看得到這個的)§!
  gts_leader_bruh.0101.d: "This is a test option §R(you shouldn't be seeing this)§!"
  #  §Y寵物徵收§!
  gts_event_bruh.0010.name: "§YPet Requisition§!"
  #  視為寵物
  gts_event_bruh.0010.a: "Treat as Pets"
  #  它們不是消耗品，而是寵物。應當給予它們尊重與關懷，讓它們成為宮殿中一道亮麗的風景線
  gts_event_bruh.0010.a.custom_tooltip: "They are not consumables, but pets. They should be given respect and care, letting them become a beautiful sight in the palace."
  #  投入紅燈區
  gts_event_bruh.0010.b: "Put into Red-Light District"
  #  寵物？不過是高級玩具罷了。把它們送到紅燈區去，物盡其用，讓大家開心開心，還能賺點外快
  gts_event_bruh.0010.b.custom_tooltip: "Pets? Just high-grade toys. Send them to the red-light district to be put to good use, let everyone have fun, and maybe earn some extra pocket money."
  #  §Y寵物徵收§!
  gts_event_bruh.0020.name: "§YPet Requisition§!"
  #  一道冰冷的指令從§Y[from.GetName]§!傳來。根據那份屈辱的「寵物條款」，他們要求我們提供一批公民，以滿足其巨娘公民對「寵物」的需求。徵召令上附帶著名單，上面是我們的人民、工程師、藝術家、勞工，它們現在僅僅被視為可供挑選的商品。我們該如何回應？
  gts_event_bruh.0020.desc: "A cold order has arrived from §Y[from.GetName]§!. Based on that humiliating 'Pet Clause', they demand a batch of citizens to satisfy their giantess citizens' demand for 'pets'. The conscription order is attached with a list: our people, engineers, artists, and laborers—now merely seen as commodities up for selection. How shall we respond?"
  #  含淚執行
  gts_event_bruh.0020.a: "Execute with Tears"
  #  遵守命令，交出名單上的人民。動用宣傳機器，宣稱這是「為國奉獻」，並為其家屬提供補償\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]1%的人口§!
  gts_event_bruh.0020.a.custom_tooltip: "Obey the order and hand over the listed people. Use the propaganda machine to declare this 'dedication to the nation' and provide compensation for their families.\\n§YHand over 1% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!"
  #  討價還價
  gts_event_bruh.0020.b: "Bargain"
  #  向宗主國發出請求，表示願意上繳雙倍的資源來「贖回」這些公民的自由，強調這樣對§Y[from.GetName]§!更有利可圖
  gts_event_bruh.0020.b.custom_tooltip: "Send a request to the overlord, expressing willingness to pay double resources to 'redeem' these citizens' freedom, emphasizing that this is more profitable for §Y[from.GetName]§!."
  #  §Y奴隸徵收§!
  gts_event_bruh.0040.name: "§YSlave Requisition§!"
  #  根據我們與§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!簽訂的附庸條約中的『人口取用』條款，帝國商務部例行公事地簽發了一份徵用令，要求該附庸國提供一批小人勞動力。貨物，或者說小人，已經準時送達指定的集散中心。他們被分類裝在透明的強化玻璃箱內，每個箱子容納了數以萬計的小人。他們中的大多數面露恐懼，緊緊靠在一起，仰望著對他們而言如同蒼穹般巨大的倉庫頂棚和前來驗收的帝國官員。有些箱子裡的『貨物』似乎因為運送途中的顛簸而出現了損耗，箱底沾染著不易察覺的暗紅色汙漬。一份電子清單已經上傳至您的終端，列出了這批『貨物』的數量、性別和大致健康狀況。現在，需要您對這批資源的最終用途進行批示。
  gts_event_bruh.0040.desc: "According to the 'Population Acquisition' clause in our vassal treaty with §Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!, the Imperial Commerce Department has routinely issued a requisition order for a batch of tiny laborers. The cargo—or rather, the tinies—has arrived on time at the designated distribution center. They are sorted into transparent tempered glass boxes, each holding tens of thousands. Most of them show fear, huddling together, looking up at the warehouse ceiling that is as vast as the sky to them, and at the Imperial officials conducting the inspection. In some boxes, the 'cargo' seems to have suffered losses due to the bumps during transport, with the bottom of the boxes stained with subtle dark red marks. An electronic list has been uploaded to your terminal, detailing the quantity, gender, and general health of this batch. Now, instructions for the final use of these resources are required."
  #  篩選一下，健壯的送去勞動，孱弱的送去娛樂中心
  gts_event_bruh.0040.a: "Screen them: send the strong to labor, and the weak to entertainment centers."
  #  將部分小人用於高強度的勞動消耗，另一部分則作為巨娘的玩物
  gts_event_bruh.0040.a.custom_tooltip: "Use some tinies for high-intensity labor consumption, and others as toys for giantesses."
  #  賞賜給有功的將領和官員
  gts_event_bruh.0040.b: "Reward meritorious generals and officials"
  #  將這些小人作為獎賞分發給她們，無論是用作私人奴僕、腳底按摩還是別的什麼"用途"都能極大地鼓舞士氣
  gts_event_bruh.0040.b.custom_tooltip: "Distribute these tinies as rewards; whether used as private servants, for foot massages, or other 'purposes', it will greatly boost morale."
  #  §Y奴隸徵收§!
  gts_event_bruh.0050.name: "§YSlave Requisition§!"
  #  一份來自巨人國度的指令抵達了§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!。根據那份我們無法拒絕的條約，宗主國§Y[from.GetName]§!要求我們立即提供人口，作為『特殊勞務輸出』。運輸船隊已經停靠在近地軌道，巨大的陰影投射在城市上空，如同末日降臨。國內的新聞媒體被強制噤聲，但恐慌仍透過口耳相傳蔓延開來。人們躲在家中，祈禱厄運不會降臨在自己頭上。軍隊在街上巡邏，強制徵召適齡人口，哭喊聲和呵斥聲在街上迴盪。我們深知這些同胞一旦被送走，將面臨的命運絕非簡單的『勞務』。我們必須立刻決定如何面對這道冰冷的命令。
  gts_event_bruh.0050.desc: "An order from the giantess kingdom has reached §Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!. According to the treaty we cannot refuse, the overlord §Y[from.GetName]§! demands immediate population provision as 'special labor export'. The transport fleet has docked in low-orbit, its giant shadow cast over the city like an apocalypse. The domestic news media has been forcibly silenced, but panic still spreads through word of mouth. People hide in their homes, praying misfortune doesn't fall on them. The military patrols the streets, forcibly conscripting eligible population; cries and shouts echo through the streets. We know all too well that once these compatriots are sent away, the fate they face is by no means simple 'labor'. We must immediately decide how to face this cold order."
  #  履行條款
  gts_event_bruh.0050.a: "Fulfill Terms"
  #  反抗即是毀滅。為了種族的存續，我們必須忍受這份屈辱。至少...這能換來短暫的和平\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]5%的人口§!
  gts_event_bruh.0050.a.custom_tooltip: "Resistance is destruction. For the survival of our race, we must endure this humiliation. At least... it will buy us a brief peace.\\n§YHand over 5% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!"
  #  諂媚討好
  gts_event_bruh.0050.b: "Fawning and Flattery"
  #  既然無法反抗，那就竭力討好。不僅如數上交，還要額外獻上我們『最優秀』、『最自願』的同胞，並附上諂媚的頌詞。或許極致的順從能換來一絲憐憫，甚至是一點殘羹冷炙般的賞賜\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!
  gts_event_bruh.0050.b.custom_tooltip: "Since we cannot resist, we must strive to please. Not only will we fulfill the quota, but we will also offer our 'finest' and 'most voluntary' compatriots, accompanied by fawning praise. Perhaps extreme obedience will buy a shred of mercy, or even some meager scraps as a reward.\\n§YHand over 10% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!"
  #  §Y消耗品徵收§!
  gts_event_bruh.0070.name: "§YConsumables Requisition§!"
  #  根據我們與§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!簽訂的消耗品條款，新一批的"資源"已經準備就緒，正等待您的指示進行輸送。一批數量可觀的小人正被集中看管在他們的星球上，對我們而言，那不過是腳邊的一個小籠子。是時候決定如何最大限度地利用這些渺小的生命，來滿足帝國公民的需求與欲望了。
  gts_event_bruh.0070.desc: "According to the consumables clause signed with §Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!, a new batch of \"resources\" is ready and awaiting your instructions for transport. A significant number of tinies are being held under concentrated custody on their planet—to us, that is merely a small cage by our feet. It is time to decide how to maximize the use of these tiny lives to satisfy the needs and desires of Imperial citizens."
  #  分配至巨娘紅燈區
  gts_event_bruh.0070.a: "Distribute to Giantess Red-Light District"
  #  將這些小人分送到帝國的娛樂設施。用於滿足巨娘的性慾需求，在巨大的手指、舌尖或性器下體驗極致的渺小感與絕望感，直至被碾碎，為帝國的娛樂產業貢獻其微不足道的價值
  gts_event_bruh.0070.a.custom_tooltip: "Distribute these tinies to the Empire's entertainment facilities. Used to satisfy giantesses' sexual desires, they will experience extreme insignificance and despair under giant fingers, tongues, or genitals until they are crushed, contributing their negligible value to the Empire's entertainment industry."
  #  輸送至食品加工鏈
  gts_event_bruh.0070.b: "Transport to Food Processing Chain"
  #  將這些小人歸類為食品資源。它們將被批次處理，成為巨娘餐桌上的活點心、調味品或零食，在巨大的口腔和胃袋中結束其微不足道的存在
  gts_event_bruh.0070.b.custom_tooltip: "Classify these tinies as food resources. They will be processed in batches to become live desserts, condiments, or snacks on giantesses' tables, ending their insignificant existence within massive mouths and stomachs."
  #  §Y消耗品徵收§!
  gts_event_bruh.0080.name: "§YConsumables Requisition§!"
  #  巨型通告畫面照亮了整個首都的天空，冰冷的機械女聲宣讀著來自巨娘母星的指令。§Y[from.GetName]§!的指令如同其體型一般沉重且無可抗拒。根據那份將我們定義為『消耗品』的屈辱條款，新一批的徵收令已經送達。我們必須立即上繳又一批我們的同胞，他們將永遠離開我們的城市，也就是那些在巨娘眼中不過是鞋印縫隙裡沙礫般的聚集點。政府的抽籤系統已經開始殘酷地運轉，無數家庭在恐懼中等待著結果。街上瀰漫著絕望的氣氛，所有人都清楚被選中的命運意味著什麼。身為附庸國的領導人，您需要對此作出回應，以穩定(或利用)這沸騰的民意。
  gts_event_bruh.0080.desc: "Giant notification screens light up the capital's sky as a cold mechanical female voice reads out orders from the giantess homeworld. §Y[from.GetName]§!'s orders are as heavy and irresistible as their size. According to the humiliating clause defining us as 'consumables', a new requisition order has arrived. We must immediately hand over another batch of our compatriots; they will leave our cities forever—cities that are nothing more than congregations like sand in the cracks of shoe prints to the giantesses. The government's lottery system has begun its cruel operation, with countless families waiting for the results in terror. The atmosphere in the streets is filled with despair, and everyone knows exactly what selected fate means. As the leader of a vassal state, you must respond to stabilize (or exploit) this boiling public sentiment."
  #  履行條款
  gts_event_bruh.0080.a: "Fulfill Terms"
  #  儘管心如刀割，但反抗意味著整個文明可能被一隻巨足輕易抹去。出動治安部隊鎮壓任何形式的反抗，確保『貨物』能準時、足量地送達。並向它們保證，它們的犧牲將被銘記(儘管無人會記得)\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!
  gts_event_bruh.0080.a.custom_tooltip: "Though it's heartbreaking, resistance means the entire civilization could be easily wiped out by a single giant foot. Deploy security forces to suppress any form of resistance, ensuring the 'cargo' is delivered on time and in full. Assure them their sacrifice will be remembered (though none will remember).\\n§YHand over 10% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!"
  #  諂媚討好
  gts_event_bruh.0080.b: "Fawning and Flattery"
  #  既然無法反抗，不如極盡諂媚之能事。我們不僅足額上交，還額外交出雙倍的資源，並請求巨娘在享用貢品時，偶爾能想起我們的忠誠，以期換取未來配額可能的減少或微不足道的賞賜\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]25%的人口§!\n§Y下次徵收改為30年後§!
  gts_event_bruh.0080.b.custom_tooltip: "Since we cannot resist, it is better to exert every effort to flatter. We will not only meet the quota but also offer double the resources in addition, requesting that the giantesses occasionally remember our loyalty when enjoying the tribute, in hopes of potential future quota reductions or meager rewards.\\n§YHand over 25% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!\\n§YNext requisition changed to 30 years later§!"
  #  §MColin‧Bruh‧Dex   "鵝"§!
  concept_bruh_full_name: "§MColin‧Bruh‧Dex   \"Goose\"§!"
  #  已經購買過驅逐艦娘地圖
  gts_bruh_shipgirl_has_trigger_purchase_1: "Already purchased Destroyer Shipgirl Map"
  #  已經購買過戰列艦娘地圖
  gts_bruh_shipgirl_has_trigger_purchase_2: "Already purchased Battleship Shipgirl Map"
  #  已經購買過無畏艦娘地圖
  gts_bruh_shipgirl_has_trigger_purchase_3: "Already purchased Dreadnought Shipgirl Map"
  #  $TRIGGER_FAIL$必須擁有精液巨型港口
  MUST_HAVE_GTS_BRUH_SEMEN_SYSTEM_CAPITAL: "$TRIGGER_FAIL$Must possess a Semen Mega-Port"
  #  艦娘遺跡
  gts_bruh_shipgirl_country_debuff_1: "Shipgirl Ruins"
  #  艦娘弱點
  gts_bruh_shipgirl_country_debuff_2: "Shipgirl Weakness"
  #  設定5%保費
  gts_bruh_insurance_rate_policy_flag_1_opinion_modifiers: "Set 5% Premium"
  #  設定4%保費
  gts_bruh_insurance_rate_policy_flag_2_opinion_modifiers: "Set 4% Premium"
  #  設定2%保費
  gts_bruh_insurance_rate_policy_flag_3_opinion_modifiers: "Set 2% Premium"
  #  設定1%保費
  gts_bruh_insurance_rate_policy_flag_4_opinion_modifiers: "Set 1% Premium"
  #  設定0%保費
  gts_bruh_insurance_rate_policy_flag_5_opinion_modifiers: "Set 0% Premium"
  #  保險費率
  policy_gts_bruh_insurance_rate: "Insurance Premium Rate"
  #  設定5%保費
  gts_bruh_insurance_rate_1: "Set 5% Premium"
  #  設定4%保費
  gts_bruh_insurance_rate_2: "Set 4% Premium"
  #  設定2%保費
  gts_bruh_insurance_rate_3: "Set 2% Premium"
  #  設定1%保費
  gts_bruh_insurance_rate_4: "Set 1% Premium"
  #  設定0%保費
  gts_bruh_insurance_rate_5: "Set 0% Premium"
  #  $gts_bruh_insurance_rate_1$
  gts_bruh_insurance_rate_1_name: "$gts_bruh_insurance_rate_1$"
  #  $gts_bruh_insurance_rate_2$
  gts_bruh_insurance_rate_2_name: "$gts_bruh_insurance_rate_2$"
  #  $gts_bruh_insurance_rate_3$
  gts_bruh_insurance_rate_3_name: "$gts_bruh_insurance_rate_3$"
  #  $gts_bruh_insurance_rate_4$
  gts_bruh_insurance_rate_4_name: "$gts_bruh_insurance_rate_4$"
  #  $gts_bruh_insurance_rate_5$
  gts_bruh_insurance_rate_5_name: "$gts_bruh_insurance_rate_5$"
  #  執行最高規格的保費方案。獲准對客戶星球啟動廣域地表刮削作業，強制徵收該星球總人口的5%。這一比例對於任何微觀文明而言皆屬災難性的社會創傷，將導致其勞動力斷層與經濟崩潰，並極大降低客戶的外交態度。然而，這將為公司帶來極其豐厚的「小人資源」，滿足內部對微縮生物的高漲需求。
  gts_bruh_insurance_rate_1_desc: "Executes the highest-spec premium plan. Authorized to initiate wide-area surface scraping operations on the client planet, forcibly requisitioning 5% of the total population. This ratio is a catastrophic social trauma for any micro-civilization, leading to labor gaps and economic collapse, and significantly lowering the client's diplomatic stance. However, it will bring极其 rich 'tiny resources' to the company, satisfying internal surging demand for micro-organisms."
  #  執行標準偏高的保費方案，將保險費率上調至4%\n這一比例雖略低於極限壓榨，但對於微觀文明而言，短時間內失去大量人口仍是沉重的負擔。預期客戶社會內部會產生強烈的恐慌與不滿情緒，外交評估報告指出，長期維持此費率將持續侵蝕雙方信任基礎。雖然能確保大量資源流入，但需警惕潛在的違約行為，建議加強對該星球的武力威懾以確保合約履行。
  gts_bruh_insurance_rate_2_desc: "Executes a high-standard premium plan, raising the insurance rate to 4%.\\nWhile this ratio is slightly lower than extreme exploitation, losing a large population in a short time is still a heavy burden for micro-civilizations. Strong panic and dissatisfaction are expected within the client's society. Diplomatic assessment reports indicate that maintaining this rate long-term will continue to erode the foundation of trust. Although it ensures a large influx of resources, one must be wary of potential defaults; strengthening military deterrence over the planet is recommended to ensure contract fulfillment."
  #  維持標準的保費方案，將保險費率設定為2%\n這是一個精算後的折衷商業選擇，既能維持公司的基礎資源運作與巨娘員工的日常消耗需求，又不至於在短時間內徹底破壞客戶的社會再生產能力。客戶對此雖然懷有恐懼，但在絕對體型威懾下尚能維持基本的服從與運作。
  gts_bruh_insurance_rate_3_desc: "Maintains a standard premium plan, setting the insurance rate to 2%.\\nThis is an actuarially compromised commercial choice that maintains the company's basic resource operations and the daily consumption needs of giantess employees without thoroughly destroying the client's social reproduction capabilities in a short time. While the client harbors fear, they can still maintain basic obedience and operation under absolute size deterrence."
  #  採取象徵性的保費方案，僅徵收1%的人口作為象徵性保費。對於坐擁龐大人口基數的微觀文明而言，這一損失比例極低，甚至低於其自身因自然災害或疾病造成的自然傷亡率。這種相對寬鬆的策略極大緩解了客戶的生存壓力與恐慌感，有助於維持較高的信任度與良好的外交態度。雖然公司本週期獲得的實體生物資源減少，但穩定的客戶關係有利於長期的滲透與其他高附加值服務的推廣，符合長遠利益最大化模型。

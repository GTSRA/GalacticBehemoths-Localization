  d_gts_bruh_panties_planet_07_deposits: "Fabric Ship Wreckage"
  #  對應艦娘尿道口的織物區域呈現出硬化的深黃色。無數次排尿後殘留的尿液在這裡反覆乾燥、結晶，形成了堅硬的琥珀色礦脈。這些晶體散發著濃烈的氨氣味道，只需輕輕敲擊就能粉碎，從中提取出高純度的化學原料，那是艦娘體內代謝出的精華。
  d_gts_bruh_panties_planet_01_deposits_desc: "The fabric area corresponding to the shipgirl's urethral opening presents a hardened deep yellow color. After countless urinations, residual urine has repeatedly dried and crystallized here, forming hard amber-colored veins. These crystals emit a strong ammonia smell and can be crushed with a light strike to extract high-purity chemical raw materials—the essence metabolized from within the shipgirl's body."
  #  位於胖次正中央最濕潤的凹陷處。這裡是艦娘陰戶直接接觸的地方，積累了巨量的透明愛液。這些液體即使暴露在真空中也沒有乾涸，而是形成了一片粘稠拉絲的湖泊，不斷釋放出令人頭暈目眩的濃烈費洛蒙，任何掉進去的物體都會被死死黏住，最終沉入底部。
  d_gts_bruh_panties_planet_02_deposits_desc: "Located in the most moist depression in the center of the pantsu. This is where the shipgirl's vulva directly contacts, accumulating a massive amount of transparent love juice. Even exposed to the vacuum, these liquids have not dried up; instead, they formed a viscous, stringy lake that constantly releases dizzyingly strong pheromones. Any object that falls in will be stuck fast and eventually sink to the bottom."
  #  由於艦娘大腿根部的頻繁摩擦，這片區域的棉布纖維斷裂並糾纏在一起，形成了高達數千公尺的巨型毛球。這些毛球內部結構鬆散，如同迷宮一般，同時吸附了大量的汗水 and 微小的汙垢顆粒，是開採紡織原料的絕佳場所。
  #  由於艦娘大腿根部的頻繁摩擦，這片區域的棉布纖維斷裂並糾纏在一起，形成了高達數公里的巨型毛球。這些毛球內部結構鬆散，如同迷宮一般，同時吸附了大量的汗水和微小的汙垢顆粒，是開採紡織原料的絕佳場所。
#  由於艦娘大腿根部的頻繁摩擦，這片區域的棉布纖維斷裂並糾纏在一起，形成了高達數公里的巨型毛球。這些毛球內部結構鬆散，如同迷宮一般，同時吸附了大量的汗水和微小的汙垢顆粒，是開採紡織原料的絕佳場所。
  d_gts_bruh_panties_planet_03_deposits_desc: "Due to the frequent friction from the shipgirl's inner thighs, the cotton fibers in this area have broken and become entangled, forming giant fuzzballs several kilometers high. The internal structure of these fuzzballs is loose and maze-like, while adsorbing large amounts of sweat and tiny grime particles, making them excellent sites for mining textile raw materials."

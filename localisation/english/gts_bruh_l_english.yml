  gts_leader_bruh.0021.desc: "General Goose's iconic face appeared on the communication screen. This creature, which always makes strange noises, has recently been staring blankly at the laundry the shipgirls changed out of—massive panties spreading like continents and emitting intense scents, piled high like mountains. A sudden flash of inspiration struck, and a crazy idea was born in that clever head. \\\\n\\\\n§M\\\"Just inserting planets into the aperture isn't enough!\\\"§! \\\\n\\\\n§Y(It shouts, slamming the table)§! \\\\n\\\\n§M\\\"We need a way to make the enemy live in the shadow of the giantess's crotch for generations! An ultimate weapon that can humiliate them, block them, and force their descendants to breathe nothing but the scent of a girl's private parts!\\\"§! \\\\n\\\\nGeneral Goose explained the plan, while the screen showed a schematic of a giant shipgirl panty completely enveloping entire planets. It needs to collect detailed data from different types of planets being inserted into the shipgirls' apertures to calculate the most suitable panty material strength, elasticity coefficients, and a fabric formula that can perfectly preserve the shipgirls' body scent. \\\\n\\\\n§M\\\"I need data from seven planets with different environments,\\\"§! \\\\n\\\\n§Y(General Goose says excitedly)§! \\\\n\\\\n§M\\\"Barren, Frozen, Toxic, Molten, Desert, Cold, and those full of life! Shove them all in, then record every contraction of the aperture's inner walls, the volume of love juice secretion, and the specific data of the planet's surface being crushed!\\\"§! \\\\n\\\\nIt points to the seven target planets marked on the screen. \\\\n\\\\n§M\\\"Complete these experiments, and I can create a special Colossus weapon. It can take the shipgirl's just-removed panties, still covered in love fluid and crotch residue, and envelop the enemy's home planet completely! Let that planet forever carry the scent of a girl's private parts!\\\"§! \\\\n\\\\n§YMission Objective: Use the [Insert into Aperture] Colossus weapon to process 7 designated planets (Track locations in Situation Log)§!"
#  無畏艦娘剛剛結束了一場長達兩週的巡邏任務，身上的衣物早已被汗水浸透。一支艦隊小心翼翼地接近正在休息的艦娘。她此刻正漂浮在恆星基地附近，雙腿微微張開，讓恆星過被汗水浸濕的胯部。那條藍白條紋的胖次已經完全變了顏色，原本鮮艷的藍色變成了暗沉的灰藍，而白色部分則呈現出不均勻的黃褐色。\n\n§Y"艦娘小姐，我們需要...呃...收集您的...那個..."§!\n\n艦隊指揮官結結巴巴地通過通訊器說道。艦娘睜開眼睛，看著那些漂浮在她胯下，如同飛蚊的的小飛船，臉上露出疑惑的表情。\n\n§R"收集什麼？"§!\n\n§Y"您的...內褲..."§!\n\n指揮官硬著頭皮說出來，聲音小得像蚊子。\n\n§R"啊？！"§!\n\n艦娘的臉瞬間漲紅。\n\n§Y"你們要我的胖次？這...這也太羞恥了吧！而且我已經穿了兩個星期了，肯定很臭..."§!\n\n§M"正是因為這樣才需要！"§!\n\n鵝將軍的聲音突然插入通訊。\n\n§M"我需要您最原汁原味的胖次！上面的汗液、愛液、尿漬、陰垢，全都是寶貴的研究材料！拜託了，這關係到帝國的未來！"§!\n\n艦娘猶豫了很久，最後還是嘆了口氣。\n\n§R"好吧...但你們要保證不會拿去做奇怪的事情..."§!\n\n她伸手勾住胖次的邊緣，緩緩向下褪去。那條被浸透的內褲與肌膚分離時發出"嗤啦"的粘連聲，襠部的布料更是因為乾涸的愛液而變得硬邦邦的。當胖次完全脫下時，一股濃烈的氣味瞬間擴散開來。當胖次被放入貨艙時，艦員們即使隔著密封艙，也能聞到那股混合了汗臭、尿騷和腥味的複合氣味。有幾個人當場就暈了過去，剩下的人強忍著噁心，用機械臂小心翼翼地將這條巨大的胖次收納進特製的密封容器中。\n\n§Y"樣本採集完成...天啊...我這輩子都不想再聞到這種味道了..."§!\n\n指揮官虛弱地說道。而在基地裡，鵝將軍已經迫不及待地打開了密封容器。濃烈的氣味像實體一樣湧出，整個基地瞬間被這股臭味淹沒。但鵝將軍絲毫不在意，它興奮地撲向那條有如平原一般的胖次，開始仔細檢查每一處汙漬。\n\n§M"完美!完美!這襠部的黃漬簡直是藝術品！"\n"看這濃度!看這粘稠度!這得有多少愛液和汗水才能累積成這樣！"§!\n\n§Y(日誌結束)§!
  gts_leader_bruh.0023.desc: "The Dreadnought Shipgirl had just finished a two-week patrol mission, her clothing long since soaked in sweat. A fleet cautiously approached the resting shipgirl. She was currently floating near the starbase, her legs slightly apart, letting the sun pass over her sweat-soaked crotch. Those blue and white striped panties had completely changed color: the once bright blue had turned into a dull grayish-blue, while the white parts showed uneven yellowish-brown stains. \\\\n\\\\n§Y\\\"Shipgirl-san, we need to... er... collect your... that...\\\"§! \\\\n\\\\nbleated the fleet commander over the communicator. The shipgirl opened her eyes, looking at those tiny ships floating beneath her crotch like gnats, her face showing a puzzled expression. \\\\n\\\\n§R\\\"Collect what?\\\"§! \\\\n\\\\n§Y\\\"Your... underwear...\\\"§! \\\\n\\\\nThe commander braced himself and spoke, his voice as small as a mosquito's. \\\\n\\\\n§R\\\"Ah?!\\\"§! \\\\n\\\\nThe shipgirl's face instantly turned bright red. \\\\n\\\\n§Y\\\"You want my panties? This... this is too embarrassing! Besides, I've been wearing them for two weeks, they must be smelly...\\\"§! \\\\n\\\\n§M\\\"That's exactly why we need them!\\\"§! \\\\n\\\\nGeneral Goose's voice suddenly cut into the communication. \\\\n\\\\n§M\\\"I need your most original, authentic panties! The sweat, love fluid, urine stains, and crotch residue on them are all precious research materials! Please, this concerns the future of the Empire!\\\"§! \\\\n\\\\nThe shipgirl hesitated for a long time before finally sighing. \\\\n\\\\n§R\\\"Fine... but you must promise you won't use them for weird things...\\\"§! \\\\n\\\\nShe hooked her finger into the edge of the panties and slowly pulled them down. The sound of the soaked fabric separating from the skin was a sticky 'schlorp', and the fabric at the crotch was stiff from dried love fluid. When the panties were completely removed, an intense scent instantly diffused. As the panties were placed in the cargo bay, the crew could smell that complex mixture of sweat, urine, and fishy odors even through sealed cabins. Several people fainted on the spot, while the rest endured the nausea, using robotic arms to carefully store the massive panties in a specially made sealed container. \\\\n\\\\n§Y\\\"Sample collection complete... Heavens... I hope I never have to smell that again in my life...\\\"§! \\\\n\\\\nsaid the commander weakly. Back at the base, General Goose had already impatiently opened the sealed container. The intense odor surged out like a solid entity, instantly flooding the entire base. But General Goose didn't care at all, excitedly pouncing on the plain-sized panties and beginning to inspect every stain. \\\\n\\\\n§M\\\"Perfect! Perfect! These yellow stains at the crotch are a work of art!\\\"\\\\n\\\"Look at this concentration! This viscosity! Just how much love fluid and sweat must have accumulated to become like this!\\\"§! \\\\n\\\\n§Y(Log ends)§!"
  gts_event_bruh.0010.desc: "The ambassador of §Y[event_target:gts_bruh_get_subject_pop_usage_1_country.GetName]§! has arrived at your palace with a team of carefully selected little people. These tiny people have been trained to be polite and are dressed in magnificent attire, their eyes a mix of fear and a hint of the honor of being chosen. According to the 'Pet Clause' we signed, this is their duty. The ambassador respectfully presented the list and explained to you that these are this session's most 'high-quality' pet candidates, having undergone health screenings and rigorous training to provide you with the best service. Now, it is time to decide how to 'use' this batch of living tributes."
  #  根據本公司與微觀客戶簽署的§Y《天體級生物安全保障協定》§!，每隔十年，公司將啟動資產回收程序進行保費結算。鑑於雙方在體型與經濟體系上的維度差異，常規貨幣已失去流通意義，因此協議規定以該文明的「生物人口」作為唯一認可的等價交換物。董事會可需根據當前的庫存需求與外交戰略，調整本週期的保費徵收費率。此項決策將直接決定流入公司加工廠與寵物市場的貨源數量，同時也會對客戶文明的社會結構造成不同程度的物理性削減，進而影響其對公司的外交態度。\n\n§Y(只會向人口超過5000的星球收費)§!
  policy_gts_bruh_insurance_rate_desc: "According to the §Y'Celestial-level Bio-Security Guarantee Agreement'§! signed between this Company and our micro-clients, every ten years, the Company will initiate asset recovery procedures for insurance premium settlement. Given the dimensional differences between the two parties in terms of size and economic systems, conventional currency has lost its significance for circulation; therefore, the agreement stipulates 'biological population' as the only recognized equivalent for exchange. The board of directors may adjust this cycle's premium collection rate based on current inventory needs and diplomatic strategies. This decision will directly determine the volume of 'goods' flowing into our processing plants and pet markets, while also causing varying degrees of physical reduction to the client civilizations' social structure, thereby affecting their diplomatic attitude toward the Company. \\n\\n§Y(Only charges planets with a population over 5000)§!"

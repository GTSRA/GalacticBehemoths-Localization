    gts_leader_bruh.0005.desc: "在支付了款項後，地圖上顯示了一個星系，附近一個未連接到任何超空間通道，名為§Y[event_target:gts_bruh_random_spawn_system_3.GetName]§!的脈衝星被標記了出來。\n\n查詢§S情報日誌§!以追蹤位置"

    gts_leader_bruh.0006.name: "擊敗驅逐艦娘"
    gts_leader_bruh.0006.desc: "戰鬥結束了。那位曾在星海中靈活穿梭的驅逐艦娘終於倒在了我們艦隊的集火之下。她那嬌小(相對而言)的身軀上布滿了灼燒的痕跡，破損的舾裝還在不斷漏出冷卻液，毫無生氣地漂浮在太空中，我們的工程師迫不及待地登上了她的殘骸。在那已經失去光澤的舾裝中，我們找到了大量技術資料，關於如何在巨大的身軀上維持驚人的機動性，如何用動能武器發揮出毀滅性的威力，以及那些綁在她大腿上的魚雷發射管的設計藍圖。\n\n§G解鎖隨機一種§MBruh驅逐艦娘§!圖紙§!\n\n§Y需要研發配件才會顯示在設計器裡§!"
    gts_leader_bruh.0006.a: "確定"
    gts_leader_bruh.0007.name: "擊敗戰列艦娘"
    gts_leader_bruh.0007.desc: "這是一場艱苦的戰鬥。那位戰列艦娘直到最後一刻還在開火，她肩上的主炮在熄滅前轟出了最後一發炮彈，將我們三艘主力艦送進了歷史。但最終她還是倒下了。在她那已經冷卻的身軀中，我們還找到了一本筆記。裡面記錄著她對每一場戰鬥的感想，對每一次開火的校正數據，以及...對家鄉的思念。原來她也曾是某個文明培養出的守護者。\n\n§G解鎖隨機一種§MBruh戰列艦娘§!圖紙§!\n\n§Y需要研發配件才會顯示在設計器裡§!"
    gts_leader_bruh.0008.name: "擊敗無畏艦娘"
    gts_leader_bruh.0008.desc: "我們做到了。付出了慘痛的代價後，我們擊敗了那位曾讓整個星區為之顫抖的無畏艦娘。當她那比恆星還要巨大的身軀終於停止掙扎時，整個戰場陷入了詭異的寂靜。沒有人敢第一個靠近她。那些曾經吞噬過星球的唇瓣，那雙能夠徒手捏碎戰艦的玉手，那柄削鐵如泥的斬艦刀...即使在死亡面前，她依然散發著令人窒息的威壓。花了整整一個月，我們才完成對她屍體的初步勘探。我們發現了她的記憶數據。原來在變成這樣的存在之前，她也曾是個普通的少女，是某種我們無法理解的技術將她改造成了這樣的「武器」。在記憶的最後，一個想法閃過了她的腦海中。"我已經記不清自己的名字了，但我還記得...我曾經也想要被溫柔對待......"\n§V(研究團隊陷入了長久的沉默)§!\n\n§G解鎖隨機一種§MBruh無畏艦娘§!圖紙§!\n\n§Y需要研發配件才會顯示在設計器裡§!"
    #gts_leader_bruh.0009.desc: "我這有兩個能提升速度的選項§R(想好了再用，非必要別用)§!\n\n§R摧毀所有普通帝國大部分的軍用船隻，不包含民用船只§Y(小幅提升遊戲速度)§!§!\n\n§R摧毀所有普通帝國幾乎所有的船隻，包含開採站及星港§Y(大幅提升遊戲速度，但會失去除了殖民地以外的星系)§!§!"
    #gts_leader_bruh.0009.a: "§R摧毀所有普通帝國大部分的軍用船隻，不包含民用船隻"
    #gts_leader_bruh.0009.b: "§R摧毀所有普通帝國幾乎所有的船隻，包含開採站及星港"
    gts_leader_bruh.0009.hire: "回到上一頁"
    gts_leader_bruh.0009.close: "還是算了"

    gts_leader_bruh.0021.name: "鵝將軍的奇妙提案"
    gts_leader_bruh.0021.desc: "通訊螢幕上出現了鵝將軍那張標誌性的臉龐。這隻總是發出奇怪叫聲的生物最近一直盯著艦娘們換洗下來的衣物發呆，那些面積媲美大陸、散發著濃烈氣味的巨大胖次堆積如山。它突然靈光一閃，那顆聰明的腦袋裡誕生了一個瘋狂的想法。\n\n§M"光是把星球塞進小穴內還不夠！"§!\n\n§Y(它拍著桌子大喊)§!\n\n§M"我們需要一種能讓敵人世世代代都活在巨娘胯下陰影之中的手段!一種能夠羞辱它們、封鎖它們、讓它們的後代只能呼吸少女私處氣味的終極武器！"§!\n\n鵝將軍說明了它的計劃，畫面上顯示著一條巨大的艦娘胖次完整包裹住整顆星球的示意圖。它需要收集不同類型星球被塞入艦娘小穴後的詳細數據，以便計算出最合適的胖次材料強度、彈性係數，以及能夠完美保存艦娘體味的織物配方。\n\n§M"我需要七種不同環境的星球數據"§!\n\n§Y(鵝將軍興奮地說)§!\n\n§M"荒蕪的、冰凍的、有毒的、熾熱的、乾燥的、寒冷的，還有那種生機勃勃的！把它們全都塞進去，然後記錄下艦娘小穴內壁的每一次收縮、愛液的分泌量、以及星球表面被碾壓的具體數據！"§!\n\n它指著螢幕上標記出的七個目標星球。\n\n§M"完成這些實驗，我就能製造出一種特殊的巨像武器。它能把艦娘剛脫下的、還沾滿愛液和陰垢的胖次完整地套在敵人的母星上！讓那顆星球永遠沾著少女私處的氣息！"§!\n\n§Y任務目標：使用艦娘的【塞入小穴】巨像武器處理掉7個指定星球(查詢情報日誌以追蹤位置)§!"
    gts_leader_bruh.0021.a: "這個計劃...居然有些道理？"
    gts_leader_bruh.0021.b: "忽略這個奇怪的生物"

    gts_leader_bruh.0022.name: "究極的原味兵器"
    gts_leader_bruh.0022.desc: "通訊螢幕上，鵝將軍興奮地揮舞著翅膀，它身後的實驗室裡堆滿了各種數據圖表和材料樣本。\n\n§M"成功了！我成功了！"§!\n\n§Y(它激動地大喊)§!\n\n§M"經過對七種不同星球的詳細數據分析，我終於研發出了完美的胖次包覆武器！"§!\n\n§M"套上去的過程非常簡單"\n\n"艦娘只需要像平時脫胖次一樣，把它從身上褪下來，然後對準目標星球一套就行。胖次的鬆緊帶會自動收縮，緊緊勒在星球的赤道上，確保沒有任何縫隙"§!\n\n螢幕切換到實戰示範畫面。一條巨大的藍白條紋胖次被無畏艦娘脫下，她將胖次撐開，對準了一顆行星。畫面中，那條胖次完整地套在了星球上。星球的赤道位置被鬆緊帶勒出一道深深的凹痕。整顆星球被藍白條紋的布料嚴密包裹。\n\n§M"這就是我設計的殲星武器！"§!\n\n§Y(鵝將軍張開翅膀)§!\n\n§M"它不會立刻殺死敵人，而是讓他們在漫長的時間裡慢慢絕望。讓他們明白，自己的文明、自己的母星、自己呼吸的每一口空氣，都被一個巨大少女的小穴氣味所汙染，而且永遠無法擺脫！"§!\n\n它頓了頓，補充道:\n\n§M"只有一個問題。脫下胖次的艦娘可能會感到不適。建議在執行任務時攜帶備用內褲，或者乾脆真空作戰。反正以艦娘的體型，大家本來就能看到她們的裙底風光了"§!\n\n通訊即將結束時，鵝將軍認真地說:\n\n§M"感謝您對這個項目的支持。正是七次實驗提供的寶貴數據，才讓這個武器得以誕生。現在，原味胖次包覆武器已經可以正式投入生產了"\n\n§Y獲得新巨像武器：$tech_gts_bruh_shipgirl_planet_killer_panties$§!"
    gts_leader_bruh.0022.a: "偉大的發明...大概吧..."
    gts_leader_bruh.0022.b: "有點同情那些被套住的星球了"

    gts_leader_bruh.0023.name: "不明日期與地點的日誌"
    gts_leader_bruh.0023.desc: "無畏艦娘剛剛結束了一場長達兩週的巡邏任務，身上的衣物早已被汗水浸透。一支艦隊小心翼翼地接近正在休息的艦娘。她此刻正漂浮在恆星基地附近，雙腿微微張開，讓恆星過被汗水浸濕的胯部。那條藍白條紋的胖次已經完全變了顏色，原本鮮艷的藍色變成了暗沉的灰藍，而白色部分則呈現出不均勻的黃褐色。\n\n§Y"艦娘小姐，我們需要...呃...收集您的...那個..."§!\n\n艦隊指揮官結結巴巴地通過通訊器說道。艦娘睜開眼睛，看著那些漂浮在她胯下，如同飛蚊的的小飛船，臉上露出疑惑的表情。\n\n§R"收集什麼？"§!\n\n§Y"您的...內褲..."§!\n\n指揮官硬著頭皮說出來，聲音小得像蚊子。\n\n§R"啊？！"§!\n\n艦娘的臉瞬間漲紅。\n\n§Y"你們要我的胖次？這...這也太羞恥了吧！而且我已經穿了兩個星期了，肯定很臭..."§!\n\n§M"正是因為這樣才需要！"§!\n\n鵝將軍的聲音突然插入通訊。\n\n§M"我需要您最原汁原味的胖次！上面的汗液、愛液、尿漬、陰垢，全都是寶貴的研究材料！拜託了，這關係到帝國的未來！"§!\n\n艦娘猶豫了很久，最後還是嘆了口氣。\n\n§R"好吧...但你們要保證不會拿去做奇怪的事情..."§!\n\n她伸手勾住胖次的邊緣，緩緩向下褪去。那條被浸透的內褲與肌膚分離時發出"嗤啦"的粘連聲，襠部的布料更是因為乾涸的愛液而變得硬邦邦的。當胖次完全脫下時，一股濃烈的氣味瞬間擴散開來。當胖次被放入貨艙時，艦員們即使隔著密封艙，也能聞到那股混合了汗臭、尿騷和腥味的複合氣味。有幾個人當場就暈了過去，剩下的人強忍著噁心，用機械臂小心翼翼地將這條巨大的胖次收納進特製的密封容器中。\n\n§Y"樣本採集完成...天啊...我這輩子都不想再聞到這種味道了..."§!\n\n指揮官虛弱地說道。而在基地裡，鵝將軍已經迫不及待地打開了密封容器。濃烈的氣味像實體一樣湧出，整個基地瞬間被這股臭味淹沒。但鵝將軍絲毫不在意，它興奮地撲向那條有如平原一般的胖次，開始仔細檢查每一處汙漬。\n\n§M"完美!完美!這襠部的黃漬簡直是藝術品！"\n"看這濃度!看這粘稠度!這得有多少愛液和汗水才能累積成這樣！"§!\n\n§Y(日誌結束)§!"
    gts_leader_bruh.0023.a: "(*´･д･)?"
    gts_leader_bruh.0023.b: "忽略這個奇怪的生物"

    gts_leader_bruh.0101.desc: "Colin很懶，這裡什麼都沒有(如果你有什麼文案想法就連絡Colin吧)\n\n總之有小人被巨娘UB並被轉化成巨娘了"
    gts_leader_bruh.0101.a.desc: "在最近人們私下生活中，個人式提供性服務的行業裡出現攜帶小人一同上門服務的現象，而在這些服務者中，很大一部分巨娘用的是買來一次性使用的奴隸，僅有少量的那麼幾位是與她們的兄弟，朋友乃至伴侶，提供並不會傷及小人性命的服務，但不知道是因為稀缺還是這樣的服務更舒服，後者是要比前者更受歡迎。那些夜晚到家欲求不滿的，希望有其他人能狠狠的，充足地填補她們空虛的巨娘，會在灰暗的夜晚，月亮被雲霧遮蓋時撥打電話可求起這項服務，而要不了多久就會有人敲響她的房門，攜帶著小人奴隸的嫵媚巨娘便與顧客在床上匯合。在清洗過身體之後，屋主會被要求躺在床上叉開雙腿用手指剝開陰唇，掰開粉紅的小穴，任由嫵媚的巨娘將一個個糖果大小的小人用手指塞到深處，接著手指抽開，淫肉將小穴內的小人吞沒覆蓋，品嘗起猛然激烈的感受。而嫵媚的巨娘又會在此時像品嘗糖果一樣含入一個小人，撲倒屋主與其激烈地擁吻起來，品嘗分享起滋味。兩條如蟒的巨舌糾纏不休，不斷地剮蹭，纏繞，緊緊包裹住小人的身體，榨取糖果小人的汁液。而只能維持一段時間，這顆小人糖果便會失去味道，失去汁液，失去反應，失去生命，失去了價值只能被屋主舌尖捲起吞入腹中，再補換上一顆新的糖果。淫靡色情中巨娘的小穴把小人的生命力咀嚼的一乾二淨，讓兩位巨娘的身體變得炙熱一些，嫵媚巨娘又往各自小穴裡補充了點小人，抽出一根有著點點凸起粗大的矽膠雙頭龍，插入下體，將另一端對準屋主小穴猛然收腰頂胯。屋主能感覺到小穴被粗暴撐開，小穴內的小人被緊緊頂到子宮頸口，在嫵媚巨娘不斷的收腰擺臀，小穴不斷吞吐抽插中，一個個在肉壁上被碾碎爆開，成為小穴內源源不斷的快感，最終在一個臨界點被巨娘的愛液沖洗排除。儘管這些個人式提供的性服務，大多都沒有證書，不合法但也的確促進了人口的產生，政府便也對此，睜一隻眼閉一隻眼了。"
    gts_leader_bruh.0101.b.desc: "為了文明的繁盛人口繁榮，在法案頒布之後，有關ub方面的文化、綜藝文學等等皆得到了政府部分的支持，並在人口誕生方面提供了相應的政策，讓人們消無了此方面的顧慮。甚至在科學領域裡，也宣揚起進行ub時的愉悅放鬆對人們精神身體方面有著不小的裨益。而擁有ub狂熱特質的人們，大多數對於最近這些類似的文化潮流，皆有興奮贊同的態度，並在這方面的行為舉止，思想觀念更為開放，愈加沒有顧慮的使用小人奴隸用來ub。§Y[root.GetName]§!擁有著合法權益，純潔愛情的體型差情侶間，發生ub的次數也更為頻繁，而這較為親密的交互開端絕大部分由體型優勢的女方提出。當那些疲乏的巨娘到家之後，看到可愛的對象為自己的家付出的小小勞動，大部分只能做到整理一起共枕的床榻，並用一天時間在傍晚提供一份小小巧巧、精緻的飯菜。那可愛又柔弱微小的模樣，也要為家庭奉獻小小力量的態度，足以洗去巨娘的疲乏，勾動她們的性趣，在飯後向小對象索取今日最後一項勞動。在白天收拾整潔的床上，巨娘與小人坦誠相待，而大部分巨娘此時會急不可耐地一把抓住小人丟入濕漉漉的小穴內，感受下體微小的掙扎，而那些意志力較強，可以克制住自己性慾的巨娘，會先玩弄小人對象，讓小人進入狀態，並讓小人掌握進入小穴主動權，而那些被玩弄到興奮的小人，卻始終會無法控制的主動鑽進小穴。在黏膩柔軟的小穴，在潮濕悶熱的腔室，在巨娘有意的輕柔下，小人可以淺層處毫無顧慮的在這為彼此帶來歡愉。而越往深處走可以帶來的歡愉，危險的程度，懷孕的機率也會越高，當然也不乏就是為了尋求這些刺激的小人，在對象尚未清醒反應過來一下，愛液的甜津中有意前往深處，貼在子宮頸上，為彼此帶來融化靈魂般的意識空白，這種情況下有75%的機率小人被淹沒窒息、肉壁擠壓碾碎，被敞開的子宮頸吞入子宮內，將自己有限的生命投入到了光榮的人口繁育中。而大部分有理智想要孩子的情侶，會更安全的使用特殊的自慰棒，把小人對象固定在頂端用公民科普教育的姿勢完成安全完成受孕，儘管因此她們又獲得了新的xp。"
    gts_leader_bruh.0101.c.desc: ""金錢不會帶給你溫暖，但小人會"\n門牌上這一段標語綴在小人玩用店的下端，而這種提供小人給巨娘遊玩，發洩慾望的店，在資源的天平傾斜下早已開遍了大街小巷，每時每刻都有人走進店內，詢問價格和玩法。但玩法通常是在一個私密房間內粉紅的大床上，提供體型大小不一的小人玩弄，或者是提供一片超大的縮小城區供多人一起遊玩，亦或者提供一間小型健身房，那些健身器材上都帶有各種體型的小人，讓巨娘做到邊鍛鍊邊愉悅。所幸在我們的治理下足以讓所有巨娘都閒資，能每天體驗一遍裡面的所有玩法。在縮小城區內巨娘將憋悶在鞋中一整天的濕潤絲足取出，解壓的踩踏著那些沒有她腳趾高建築，而那些破壞後的建築殘骸和僥倖存活下來粘在足襪上的小人，會化作不斷吸收足汗的除臭顆粒，直到他們無法吸收足汗化作無用的足垢。在發洩完破壞欲後那些巨娘躺倒在城市中，放鬆地舒展身體，感受著建築在身體下鬆軟的破裂開，湧起性趣的巨娘會抓起一大把小人與糯米構成的建築，撥開被淫液打濕的陰唇，對準小穴口傾倒入陰道內，而後另一隻手不斷揉搓著陰蒂。而那種城市也只不過是小穴的玩物、陰道填滿渺小的建築與小人充實的感覺，讓巨娘感到興奮，敏感的陰道很快收縮起來，緊緊擠壓著陰道裡的異物，將裡面的建築與小人全部夯實，磨碎浸泡在分泌的愛液中，直到這位巨娘在自慰中到達了高潮。而放鬆完之後，那些巨娘離開縮小城區到達獨屬於個人的小型健身房，隨便挑選一個車座是圓柱形，棒身帶著凸起，在弧形的頂端坐著一個小人的自行車騎上去。隨著巨娘踩動腳踏身形晃動，被小穴包裹的圓柱也不斷地進進出出，小穴內圓柱上端坐在這的小人也會聽話地在陰道深處按摩裡面的軟肉，等到高潮的臨界點或是鍛鍊到有些疲乏，巨娘便會放鬆肌肉下沉身體，讓圓柱把小人頂到子宮頸口，而被猛烈擠壓著的小人會在那敏感處進行激烈的掙扎，產生足以讓巨娘達到高潮的快感，之後那些小人會在褻瀆巨娘後被高潮的愛液窒息，或是被巨娘體重擠碎在肉壁上。在每天的休息時間裡，那些巨娘不厭其煩的在這裡放鬆鍛鍊，最終睡倒在這裡提供的床上，用調教好的、大小不一的小人塞滿小穴，感受著下體密密麻麻的舔舐感，輕撫小腹然後滿足的沉沉睡去。"
    gts_leader_bruh.0101.d.desc: "近期§Y[root.GetName]§!用小人來ub已經成為了社會上的潮流，與之相對的市場對於小人奴隸的需求也越來越大，以至於目前有了入不敷出的現象。儘管我們很快發現了這個問題進行了小人繁殖，但根據專業人士判斷整個市場依舊會有一段時間的小人奴隸稀缺乃至空白期。而這也導致了這段時期的小人價值水漲船高，讓某些巨娘有了別樣的心思，將手對準了有合法公民權的小人，成為遊走於灰暗地帶的小人拐賣客。對此我們只能睜一隻眼閉一隻眼的加派警力，畢竟那些微不足道的小人最終會流往市場上被帝國的中堅力量巨娘使用，填補了這段時期的空白，兩相比較下我們只在表面上維持對此類事件相當負責的態度，希望大批次的繁殖能盡早實現。而且在私底下，我們的執法人員也在使用這些小人，在她們下班回到家，吃完飯清潔完身體坐在柔軟的大床上，巨娘警官釋放壓抑一天的性慾，取出她知道是不正當途徑的小人奴隸撒到陰唇上，笑眯眯地看著小人顫抖地站不住身體，不斷的在陰唇上磕頭對著警官求饒解釋他們是有公民權的小人，只是不小心被小人販子抓到，被賣到了市場裡。“嗯？有居民權的公民在哪？在化妝檯上？還是在我的床頭櫃上？都沒有呀，我只看到我買回來不聽話的小人始終不願意認清自己的地位，侍奉比他們可高貴多的小穴大人。”這些小人顫抖的更厲害了，徹底絕望地趴倒在肥美陰唇上掩面哭泣起來，看著小人可愛的哭容，如果在高潮後活下來，就把他們送回家吧，這麼想著巨娘警官用手指按住小人移到小穴一個個捅入陰道深處這本該受她們保護的小人卻被用來自慰讓警官有了別樣的刺激感，讓她忍不住夾緊雙腿來回摩挲，更加緊緻的陰道內一個個爆裂感刺激起她的神經，她又忍不住把手指插了進去摳挖、抽插起來，在一個極致的快感後巨娘警官抵達了高潮。扁平的小人被愛液沖刷出來，暗紅的液體也被愛液沖刷出來，小穴內重又變得乾淨只是在噴出的愛液中並沒有小人存活下來，警官嘆息著嘖了一聲，收拾下墊在身下的布子，沉入了夢鄉。"

    gts_event_bruh.0010.name: "§Y寵物徵收§!"
    gts_event_bruh.0010.desc: "§Y[event_target:gts_bruh_get_subject_pop_usage_1_country.GetName]§!的大使帶著一隊精心挑選的小人來到了您的宮殿。這些小人被訓練得彬彬有禮，穿著華麗的服飾，眼神中混雜著恐懼與一絲被選中的榮耀。根據我們簽訂的"寵物條款"，這是它們應盡的義務。大使恭敬地呈上名單，並向您解釋道，這些是本屆最"優質"的寵物候選者，他們經過健康篩選和嚴苛訓練，旨在為您提供最好的服務。現在，是時候決定如何「使用」這批活體貢品了。"
    gts_event_bruh.0010.a: "視為寵物"
    gts_event_bruh.0010.a.custom_tooltip: "它們不是消耗品，而是寵物。應當給予它們尊重與關懷，讓它們成為宮殿中一道亮麗的風景線"
    gts_event_bruh.0010.b: "投入紅燈區"
    gts_event_bruh.0010.b.custom_tooltip: "寵物？不過是高級玩具罷了。把它們送到紅燈區去，物盡其用，讓大家開心開心，還能賺點外快"

    gts_event_bruh.0020.name: "§Y寵物徵收§!"
    gts_event_bruh.0020.desc: "一道冰冷的指令從§Y[from.GetName]§!傳來。根據那份屈辱的「寵物條款」，他們要求我們提供一批公民，以滿足其巨娘公民對「寵物」的需求。徵召令上附帶著名單，上面是我們的人民、工程師、藝術家、勞工，它們現在僅僅被視為可供挑選的商品。我們該如何回應？"
    gts_event_bruh.0020.a: "含淚執行"
    gts_event_bruh.0020.a.custom_tooltip: "遵守命令，交出名單上的人民。動用宣傳機器，宣稱這是「為國奉獻」，並為其家屬提供補償\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]1%的人口§!"
    gts_event_bruh.0020.b: "討價還價"
    gts_event_bruh.0020.b.custom_tooltip: "向宗主國發出請求，表示願意上繳雙倍的資源來「贖回」這些公民的自由，強調這樣對§Y[from.GetName]§!更有利可圖"

    gts_event_bruh.0040.name: "§Y奴隸徵收§!"
    gts_event_bruh.0040.desc: "根據我們與§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!簽訂的附庸條約中的『人口取用』條款，帝國商務部例行公事地簽發了一份徵用令，要求該附庸國提供一批小人勞動力。貨物，或者說小人，已經準時送達指定的集散中心。他們被分類裝在透明的強化玻璃箱內，每個箱子容納了數以萬計的小人。他們中的大多數面露恐懼，緊緊靠在一起，仰望著對他們而言如同蒼穹般巨大的倉庫頂棚和前來驗收的帝國官員。有些箱子裡的『貨物』似乎因為運送途中的顛簸而出現了損耗，箱底沾染著不易察覺的暗紅色汙漬。一份電子清單已經上傳至您的終端，列出了這批『貨物』的數量、性別和大致健康狀況。現在，需要您對這批資源的最終用途進行批示。"
    gts_event_bruh.0040.a: "篩選一下，健壯的送去勞動，孱弱的送去娛樂中心"
    gts_event_bruh.0040.a.custom_tooltip: "將部分小人用於高強度的勞動消耗，另一部分則作為巨娘的玩物"
    gts_event_bruh.0040.b: "賞賜給有功的將領和官員"
    gts_event_bruh.0040.b.custom_tooltip: "將這些小人作為獎賞分發給她們，無論是用作私人奴僕、腳底按摩還是別的什麼"用途"都能極大地鼓舞士氣"

    gts_event_bruh.0050.name: "§Y奴隸徵收§!"
    gts_event_bruh.0050.desc: "一份來自巨人國度的指令抵達了§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!。根據那份我們無法拒絕的條約，宗主國§Y[from.GetName]§!要求我們立即提供人口，作為『特殊勞務輸出』。運輸船隊已經停靠在近地軌道，巨大的陰影投射在城市上空，如同末日降臨。國內的新聞媒體被強制噤聲，但恐慌仍透過口耳相傳蔓延開來。人們躲在家中，祈禱厄運不會降臨在自己頭上。軍隊在街上巡邏，強制徵召適齡人口，哭喊聲和呵斥聲在街上迴盪。我們深知這些同胞一旦被送走，將面臨的命運絕非簡單的『勞務』。我們必須立刻決定如何面對這道冰冷的命令。"
    gts_event_bruh.0050.a: "履行條款"
    gts_event_bruh.0050.a.custom_tooltip: "反抗即是毀滅。為了種族的存續，我們必須忍受這份屈辱。至少...這能換來短暫的和平\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]5%的人口§!"
    gts_event_bruh.0050.b: "諂媚討好"
    gts_event_bruh.0050.b.custom_tooltip: "既然無法反抗，那就竭力討好。不僅如數上交，還要額外獻上我們『最優秀』、『最自願』的同胞，並附上諂媚的頌詞。或許極致的順從能換來一絲憐憫，甚至是一點殘羹冷炙般的賞賜\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!"

    gts_event_bruh.0070.name: "§Y消耗品徵收§!"
    gts_event_bruh.0070.desc: "根據我們與§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!簽訂的消耗品條款，新一批的"資源"已經準備就緒，正等待您的指示進行輸送。一批數量可觀的小人正被集中看管在他們的星球上，對我們而言，那不過是腳邊的一個小籠子。是時候決定如何最大限度地利用這些渺小的生命，來滿足帝國公民的需求與欲望了。"
    gts_event_bruh.0070.a: "分配至巨娘紅燈區"
    gts_event_bruh.0070.a.custom_tooltip: "將這些小人分送到帝國的娛樂設施。用於滿足巨娘的性慾需求，在巨大的手指、舌尖或性器下體驗極致的渺小感與絕望感，直至被碾碎，為帝國的娛樂產業貢獻其微不足道的價值"
    gts_event_bruh.0070.b: "輸送至食品加工鏈"
    gts_event_bruh.0070.b.custom_tooltip: "將這些小人歸類為食品資源。它們將被批次處理，成為巨娘餐桌上的活點心、調味品或零食，在巨大的口腔和胃袋中結束其微不足道的存在"

    gts_event_bruh.0080.name: "§Y消耗品徵收§!"
    gts_event_bruh.0080.desc: "巨型通告畫面照亮了整個首都的天空，冰冷的機械女聲宣讀著來自巨娘母星的指令。§Y[from.GetName]§!的指令如同其體型一般沉重且無可抗拒。根據那份將我們定義為『消耗品』的屈辱條款，新一批的徵收令已經送達。我們必須立即上繳又一批我們的同胞，他們將永遠離開我們的城市，也就是那些在巨娘眼中不過是鞋印縫隙裡沙礫般的聚集點。政府的抽籤系統已經開始殘酷地運轉，無數家庭在恐懼中等待著結果。街上瀰漫著絕望的氣氛，所有人都清楚被選中的命運意味著什麼。身為附庸國的領導人，您需要對此作出回應，以穩定(或利用)這沸騰的民意。"
    gts_event_bruh.0080.a: "履行條款"
    gts_event_bruh.0080.a.custom_tooltip: "儘管心如刀割，但反抗意味著整個文明可能被一隻巨足輕易抹去。出動治安部隊鎮壓任何形式的反抗，確保『貨物』能準時、足量地送達。並向它們保證，它們的犧牲將被銘記(儘管無人會記得)\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!"
    gts_event_bruh.0080.b: "諂媚討好"
    gts_event_bruh.0080.b.custom_tooltip: "既然無法反抗，不如極盡諂媚之能事。我們不僅足額上交，還額外交出雙倍的資源，並請求巨娘在享用貢品時，偶爾能想起我們的忠誠，以期換取未來配額可能的減少或微不足道的賞賜\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]25%的人口§!\n§Y下次徵收改為30年後§!"

    gts_event_bruh.1200.name: "密室會議"
    gts_event_bruh.1200.desc: "會議室內的燈光顯得格外昏暗,厚重的金屬門已經緊緊關閉,外面的警衛也被遣散到走廊盡頭.\n橢圓形的會議桌旁坐著帝國最有權勢的幾個人,§H[ruler.GetRegnalName][Root.GetRulerTitle]§!、星區總督、首相,還有幾位平時連面都很難見到的政府高層.\n每個人的臉上都寫滿了不安和困惑.\n桌子的一端,一個看起來普通的少女投影靜靜地坐在那裡.\n她看起來十分年輕,穿著簡單的白色連衣裙,雙手安靜地疊放在膝蓋上.\n如果不知道真相,任何人都會以為這只是一個無害的孩子.\n但在座的每個人都清楚,眼前這個投影背後的真實存在正漂浮在星球軌道外的太空中,她的真正體型足以用手指握住整顆星球.\n§Y"各位,感謝大家抽出寶貴時間參加這次...特殊會議."§!首相清了清嗓子,聲音有些顫抖.\n他手中的文件夾邊緣已經被汗水浸濕.\n§Y"今天討論的議題是關於...關於星球改造授權法案."§!少女投影輕鬆地靠在椅背上,雙腿輕輕晃動著,就像個在課堂上感到無聊的學生.\n§M"其實這件事沒什麼大不了的啦."§!她的聲音甜美而漫不經心.\n§M"你們想想看,我幫你們改造那些星球,其實對大家都有好處呢."§!她數著手指,語氣就像在討論明天的天氣.\n§M"比如說,那些產出不高的農業星球,我可以把它們變成超級肥沃的土地."\n"還有那些礦產枯竭的星球,經過我的...處理...之後,保證會有源源不斷的新資源."\n§!§M"而且啊."§!她歪了歪頭,笑得很天真.\n§M"人口過剩的問題也能一併解決掉,多省心呢!"§!星區總督的臉色變得蒼白如紙,雙手緊握成拳.\n§R"省心?你知道你在說什麼嗎?"§!他猛地站起身來,椅子發出刺耳的摩擦聲.\n§R"我看過那些報告!我親眼見過那些被你"改造"過的星球!"§!他的聲音變得顫抖而憤怒.\n§R"原本的藍色海洋變成了噁心的愛液!大氣層充滿了令人窒息的氣味!山脈被夷為平地,取而代之的是巨大的...的..."§!\n他停頓了一下,努力控制著自己的情緒.§R"那根本不是什麼改造!那是徹底的毀滅!"§!\n少女投影眨了眨眼睛,表情依然輕鬆,§M"哎呀,星區總督先生說話真誇張呢.那些星球現在過得很好啊,產出比以前高多了."\n§!她用手支著下巴,§M"而且居民們也很適應新環境的.那些還活著的人都說很幸福呢."§!\n§R"還活著的人?"§!星區總督的聲音近乎嘶吼.\n§R"你知道有多少人在那些"改造"中死去嗎?數十億的生命!他們被你當作玩具一樣隨意處置!"§!他轉向其他人,眼中滿含絕望.\n§R"你們都看到過那些影像資料!整座城市被碾成粉末,文明的痕跡在幾個小時內就徹底消失!那些倖存者被迫生活在...在那種環境下,根本不是人該有的生活!"§!\n會議室內陷入了死一般的沉寂.所有人都低著頭,沒有人敢接話,沒有人敢與星區總督的目光對視.\n他們都知道星區總督說的是事實,但同時也都明白反對的後果.\n少女投影似乎完全沒有被星區總督的話影響,她還是那副輕鬆的樣子.\n§M"星區總督先生也很容易激動呢.不過話說回來..."§!\n她用一種討論購物清單的語氣說道,§M"我這次想要改造的那幾顆星球,確實很有潛力."\n"想想看,經過我的處理之後,你們就能獲得那麼多新資源,還能解決掉一些...不太聽話的總督問題."\n"一舉兩得呢!"§!\n§H[ruler.GetRegnalName][Root.GetRulerTitle]§!緩緩抬起頭,聲音沙啞.\n§H"§M[event_target:gts_bruh_ap_gts_planet_event_leader.GetName]§!,我必須說,這個決定會違背我們帝國的基本原則..."§!\n§M"原則?"§!少女投影歪著頭,天真地問道,§M"什麼原則比實際利益更重要呢?而且啊..."§!\n她的語氣變得更加隨意,§M"不管你們同不同意,我都會去做的."\n"通過法律程序的話,大家面子上都好看一些嘛."§!她站起身來,雙手背在身後,就像個在花園裡散步的少女.\n§M"如果沒有這個授權書,我就只能...怎麼說呢,比較直接地行動了."\n"到時候可就沒有什麼法律保護了呢."§!\n星區總督絕望地看向其他人,但每個人都避開了他的目光.\n首相、政府高層們都緊盯著桌面,§H[ruler.GetRegnalName][Root.GetRulerTitle]§!則閉上了眼睛,似乎在進行某種內心的掙扎.\n§R"你們就這樣看著嗎?"§!星區總督的聲音變得哽咽,§R"就這樣眼睜睜地看著無數生命被當作消遣品?"§!沒有人回答他.\n少女投影輕快地拍了拍手,§M"那麼,既然大家都沒有異議,我們就開始簽字吧!§H[ruler.GetRegnalName][Root.GetRulerTitle]§!,您的簽名就代表整個帝國的意志呢."\n"多麼重要的歷史時刻啊!"§!\n首相顫抖著打開文件夾,取出那份授權書.紙張在他手中微微顫動.\n一個接一個,在座的每個人都在授權書上簽下了自己的名字.\n每一筆都沉重如山.\n星區總督最後一個簽字,他的手顫抖得幾乎握不住筆.\n當最後一個簽名完成時,少女投影開心地轉了個圈,§M"太棒了!那麼我就先去準備啦!"\n"[ruler.GetRegnalName][Root.GetRulerTitle],我會很快聯繫您討論具體時間的."§!\n投影開始變淡,她揮了揮手,§M"再見啦,各位!希望很快就能看到成果呢!"§!\n投影消失,會議室內只剩下壓抑的喘息聲."
    gts_event_bruh.1200.a: "(嘆息聲)"


    gts_event_bruh.0020.name: "§Y宠物徵收§!"
    gts_event_bruh.0020.desc: "一道冰冷的指令从§Y[from.GetName]§!传来。根据那份屈辱的「宠物条款」，他们要求我们提供一批公民，以满足其巨娘公民对「宠物」的需求。徵召令上附带着名单，上面是我们的人民、工程师、艺术家、劳工，它们现在仅仅被视为可供挑选的商品。我们该如何回应？"
    gts_event_bruh.0020.a: "含泪执行"

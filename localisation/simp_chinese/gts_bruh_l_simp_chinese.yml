    gts_leader_bruh.0003.desc: "在支付了款項後，地圖上顯示了一個星系，附近一個未連接到任何超空間通道，名為§Y[event_target:gts_bruh_random_spawn_system_1.GetName]§!的脈衝星被標記了出來。\n\n§S查詢情報日誌§!以追蹤位置"

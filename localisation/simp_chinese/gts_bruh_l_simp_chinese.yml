    gts_event_bruh.0020.b: "讨价还价"
    gts_event_bruh.0020.b.custom_tooltip: "向宗主国发出请求，表示愿意上缴双倍的资源来「赎回」这些公民的自由，强调这样对§Y[from.GetName]§!更有利可图"

    gts_event_bruh.0040.name: "§Y奴隶徵收§!"
    gts_event_bruh.0040.desc: "根据我们与§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!签订的附庸条约中的『人口取用』条款，帝国商务部例行公事地签发了一份徵用令，要求该附庸国提供一批小人劳动力。货物，或者说小人，已经准时送达指定的集散中心。他们被分类装在透明的强化玻璃箱内，每个箱子容纳了数以万计的小人。他们中的大多数面露恐惧，紧紧靠在一起，仰望着对他们而言如同苍穹般巨大的仓库顶棚和前来验收的帝国官员。有些箱子里的『货物』似乎因为运送途中的颠簸而出现了损耗，箱底沾染着不易察觉的暗红色污渍。一份电子清单已经上传至您的终端，列出了这批『货物』的数量、性别和大致健康状况。现在，需要您对这批资源的最终用途进行批示。"
    gts_event_bruh.0040.a: "筛选一下，健壮的送去劳动，孱弱的送去娱乐中心"
    gts_event_bruh.0040.a.custom_tooltip: "将部分小人用於高强度的劳动消耗，另一部分则作为巨娘的玩物"
    gts_event_bruh.0040.b: "赏赐给有功的将领和官员"
    gts_event_bruh.0040.b.custom_tooltip: "将这些小人作为奖赏分发给她们，无论是用作私人奴仆、脚底按摩还是别的什麽"用途"都能极大地鼓舞士气"

    gts_event_bruh.0050.name: "§Y奴隶徵收§!"
    gts_event_bruh.0050.desc: "一份来自巨人国度的指令抵达了§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!。根据那份我们无法拒绝的条约，宗主国§Y[from.GetName]§!要求我们立即提供人口，作为『特殊劳务输出』。运输船队已经停靠在近地轨道，巨大的阴影投射在城市上空，如同末日降临。国内的新闻媒体被强制噤声，但恐慌仍透过口耳相传蔓延开来。人们躲在家中，祈祷厄运不会降临在自己头上。军队在街上巡逻，强制徵召适龄人口，哭喊声和呵斥声在街上回荡。我们深知这些同胞一旦被送走，将面临的命运绝非简单的『劳务』。我们必须立刻决定如何面对这道冰冷的命令。"
    gts_event_bruh.0050.a: "履行条款"
    gts_event_bruh.0050.a.custom_tooltip: "反抗即是毁灭。为了种族的存续，我们必须忍受这份屈辱。至少...这能换来短暂的和平\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]5%的人口§!"
    gts_event_bruh.0050.b: "谄媚讨好"
    gts_event_bruh.0050.b.custom_tooltip: "既然无法反抗，那就竭力讨好。不仅如数上交，还要额外献上我们『最优秀』、『最自愿』的同胞，并附上谄媚的颂词。或许极致的顺从能换来一丝怜悯，甚至是一点残羹冷炙般的赏赐\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!"

    gts_event_bruh.0070.name: "§Y消耗品徵收§!"
    gts_event_bruh.0070.desc: "根据我们与§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!签订的消耗品条款，新一批的"资源"已经准备就绪，正等待您的指示进行输送。一批数量可观的小人正被集中看管在他们的星球上，对我们而言，那不过是脚边的一个小笼子。是时候决定如何最大限度地利用这些渺小的生命，来满足帝国公民的需求与欲望了。"
    gts_event_bruh.0070.a: "分配至巨娘红灯区"
    gts_event_bruh.0070.a.custom_tooltip: "将这些小人分送到帝国的娱乐设施。用於满足巨娘的性慾需求，在巨大的手指、舌尖或性器下体验极致的渺小感与绝望感，直至被碾碎，为帝国的娱乐产业贡献其微不足道的价值"
    gts_event_bruh.0070.b: "输送至食品加工链"
    gts_event_bruh.0070.b.custom_tooltip: "将这些小人归类为食品资源。它们将被批次处理，成为巨娘餐桌上的活点心、调味品或零食，在巨大的口腔和胃袋中结束其微不足道的存在"

    gts_event_bruh.0080.name: "§Y消耗品徵收§!"
    gts_event_bruh.0080.desc: "巨型通告画面照亮了整个首都的天空，冰冷的机械女声宣读着来自巨娘母星的指令。§Y[from.GetName]§!的指令如同其体型一般沉重且无可抗拒。根据那份将我们定义为『消耗品』的屈辱条款，新一批的徵收令已经送达。我们必须立即上缴又一批我们的同胞，他们将永远离开我们的城市，也就是那些在巨娘眼中不过是鞋印缝隙里沙砾般的聚集点。政府的抽签系统已经开始残酷地运转，无数家庭在恐惧中等待着结果。街上弥漫着绝望的气氛，所有人都清楚被选中的命运意味着什麽。身为附庸国的领导人，您需要对此作出回应，以稳定(或利用)这沸腾的民意。"
    gts_event_bruh.0080.a: "履行条款"
    gts_event_bruh.0080.a.custom_tooltip: "尽管心如刀割，但反抗意味着整个文明可能被一只巨足轻易抹去。出动治安部队镇压任何形式的反抗，确保『货物』能准时、足量地送达。并向它们保证，它们的牺牲将被铭记(尽管无人会记得)\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!"
    gts_event_bruh.0080.b: "谄媚讨好"
    gts_event_bruh.0080.b.custom_tooltip: "既然无法反抗，不如极尽谄媚之能事。我们不仅足额上交，还额外交出双倍的资源，并请求巨娘在享用贡品时，偶尔能想起我们的忠诚，以期换取未来配额可能的减少或微不足道的赏赐\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]25%的人口§!\n§Y下次徵收改为30年後§!"

    gts_event_bruh.1200.name: "密室会议"
    gts_event_bruh.1200.desc: "会议室内的灯光显得格外昏暗,厚重的金属门已经紧紧关闭,外面的警卫也被遣散到走廊尽头.\n椭圆形的会议桌旁坐着帝国最有权势的几个人,§H[ruler.GetRegnalName][Root.GetRulerTitle]§!、星区总督、首相,还有几位平时连面都很难见到的政府高层.\n每个人的脸上都写满了不安和困惑.\n桌子的一端,一个看起来普通的少女投影静静地坐在那里.\n她看起来十分年轻,穿着简单的白色连衣裙,双手安静地叠放在膝盖上.\n如果不知道真相,任何人都会以为这只是一个无害的孩子.\n但在座的每个人都清楚,眼前这个投影背後的真实存在正漂浮在星球轨道外的太空中,她的真正体型足以用手指握住整颗星球.\n§Y"各位,感谢大家抽出宝贵时间参加这次...特殊会议."§!首相清了清嗓子,声音有些颤抖.\n他手中的文件夹边缘已经被汗水浸湿.\n§Y"今天讨论的议题是关於...关於星球改造授权法案."§!少女投影轻松地靠在椅背上,双腿轻轻晃动着,就像个在课堂上感到无聊的学生.\n§M"其实这件事没什麽大不了的啦."§!她的声音甜美而漫不经心.\n§M"你们想想看,我帮你们改造那些星球,其实对大家都有好处呢."§!她数着手指,语气就像在讨论明天的天气.\n§M"比如说,那些产出不高的农业星球,我可以把它们变成超级肥沃的土地."\n"还有那些矿产枯竭的星球,经过我的...处理...之後,保证会有源源不断的新资源."\n§!§M"而且啊."§!她歪了歪头,笑得很天真.\n§M"人口过剩的问题也能一并解决掉,多省心呢!"§!星区总督的脸色变得苍白如纸,双手紧握成拳.\n§R"省心?你知道你在说什麽吗?"§!他猛地站起身来,椅子发出刺耳的摩擦声.\n§R"我看过那些报告!我亲眼见过那些被你"改造"过的星球!"§!他的声音变得颤抖而愤怒.\n§R"原本的蓝色海洋变成了恶心的爱液!大气层充满了令人窒息的气味!山脉被夷为平地,取而代之的是巨大的...的..."§!\n他停顿了一下,努力控制着自己的情绪.§R"那根本不是什麽改造!那是彻底的毁灭!"§!\n少女投影眨了眨眼睛,表情依然轻松,§M"哎呀,星区总督先生说话真夸张呢.那些星球现在过得很好啊,产出比以前高多了."\n§!她用手支着下巴,§M"而且居民们也很适应新环境的.那些还活着的人都说很幸福呢."§!\n§R"还活着的人?"§!星区总督的声音近乎嘶吼.\n§R"你知道有多少人在那些"改造"中死去吗?数十亿的生命!他们被你当作玩具一样随意处置!"§!他转向其他人,眼中满含绝望.\n§R"你们都看到过那些影像资料!整座城市被碾成粉末,文明的痕迹在几个小时内就彻底消失!那些幸存者被迫生活在...在那种环境下,根本不是人类该有的生活!"§!\n会议室内陷入了死一般的沉寂.所有人都低着头,没有人敢接话,没有人敢与星区总督的目光对视.\n他们都知道星区总督说的是事实,但同时也都明白反对的後果.\n少女投影似乎完全没有被星区总督的话影响,她还是那副轻松的样子.\n§M"星区总督先生也很容易激动呢.不过话说回来..."§!\n她用一种讨论购物清单的语气说道,§M"我这次想要改造的那几颗星球,确实很有潜力."\n"想想看,经过我的处理之後,你们就能获得那麽多新资源,还能解决掉一些...不太听话的总督问题."\n"一举两得呢!"§!\n§H[ruler.GetRegnalName][Root.GetRulerTitle]§!缓缓抬起头,声音沙哑.\n§H"§M[event_target:gts_bruh_ap_gts_planet_event_leader.GetName]§!,我必须说,这个决定会违背我们帝国的基本原则..."§!\n§M"原则?"§!少女投影歪着头,天真地问道,§M"什麽原则比实际利益更重要呢?而且啊..."§!\n她的语气变得更加随意,§M"不管你们同不同意,我都会去做的."\n"通过法律程序的话,大家面子上都好看一些嘛."§!她站起身来,双手背在身後,就像个在花园里散步的少女.\n§M"如果没有这个授权书,我就只能...怎麽说呢,比较直接地行动了."\n"到时候可就没有什麽法律保护了呢."§!\n星区总督绝望地看向其他人,但每个人都避开了他的目光.\n首相、政府高层们都紧盯着桌面,§H[ruler.GetRegnalName][Root.GetRulerTitle]§!则闭上了眼睛,似乎在进行某种内心的挣扎.\n§R"你们就这样看着吗?"§!星区总督的声音变得哽咽,§R"就这样眼睁睁地看着无数生命被当作消遣品?"§!没有人回答他.\n少女投影轻快地拍了拍手,§M"那麽,既然大家都没有异议,我们就开始签字吧!§H[ruler.GetRegnalName][Root.GetRulerTitle]§!,您的签名就代表整个帝国的意志呢."\n"多麽重要的历史时刻啊!"§!\n首相颤抖着打开文件夹,取出那份授权书.纸张在他手中微微颤动.\n一个接一个,在座的每个人都在授权书上签下了自己的名字.\n每一笔都沉重如山.\n星区总督最後一个签字,他的手颤抖得几乎握不住笔.\n当最後一个签名完成时,少女投影开心地转了个圈,§M"太棒了!那麽我就先去准备啦!"\n"[ruler.GetRegnalName][Root.GetRulerTitle],我会很快联系您讨论具体时间的."§!\n投影开始变淡,她挥了挥手,§M"再见啦,各位!希望很快就能看到成果呢!"§!\n投影消失,会议室内只剩下压抑的喘息声."
    gts_event_bruh.1200.a: "(叹息声)"


    edict_gts_bruh_edict_1_desc: "§G此法令可開啟人口轉化事件，每個月有40%機率§R消耗小人人口§!轉變成巨娘人口§Y(需要有UB狂熱)§!，需要1個月後才能關閉§!"

    edict_gts_bruh_edict_2: "關閉人口轉化事件"

    # 政策
    policy_gts_bruh_insurance_rate: "保險費率"
    policy_gts_bruh_insurance_rate_desc: "根據本公司與微觀客戶簽署的§Y《天體級生物安全保障協定》§!，每隔十年，公司將啟動資產回收程序進行保費結算。鑑於雙方在體型與經濟體系上的維度差異，常規貨幣已失去流通意義，因此協議規定以該文明的「生物人口」作為唯一認可的等價交換物。董事會可需根據當前的庫存需求與外交戰略，調整本週期的保費徵收費率。此項決策將直接決定流入公司加工廠與寵物市場的貨源數量，同時也會對客戶文明的社會結構造成不同程度的物理性削減，進而影響其對公司的外交態度。\n\n§Y(只會向人口超過5000的星球收費)§!"
    gts_bruh_insurance_rate_1: "設定5%保費"
    gts_bruh_insurance_rate_2: "設定4%保費"
    gts_bruh_insurance_rate_3: "設定2%保費"
    gts_bruh_insurance_rate_4: "設定1%保費"
    gts_bruh_insurance_rate_5: "設定0%保費"
    gts_bruh_insurance_rate_policy_flag_1_name: "$gts_bruh_insurance_rate_1$"
    gts_bruh_insurance_rate_policy_flag_2_name: "$gts_bruh_insurance_rate_2$"
    gts_bruh_insurance_rate_policy_flag_3_name: "$gts_bruh_insurance_rate_3$"
    gts_bruh_insurance_rate_policy_flag_4_name: "$gts_bruh_insurance_rate_4$"
    gts_bruh_insurance_rate_policy_flag_5_name: "$gts_bruh_insurance_rate_5$"
    gts_bruh_insurance_rate_1_name: "$gts_bruh_insurance_rate_1$"
    gts_bruh_insurance_rate_2_name: "$gts_bruh_insurance_rate_2$"
    gts_bruh_insurance_rate_3_name: "$gts_bruh_insurance_rate_3$"
    gts_bruh_insurance_rate_4_name: "$gts_bruh_insurance_rate_4$"
    gts_bruh_insurance_rate_5_name: "$gts_bruh_insurance_rate_5$"
    gts_bruh_insurance_rate_1_desc: "執行最高規格的保費方案。獲准對客戶星球啟動廣域地表刮削作業，強制徵收該星球總人口的5%。這一比例對於任何微觀文明而言皆屬災難性的社會創傷，將導致其勞動力斷層與經濟崩潰，並極大降低客戶的外交態度。然而，這將為公司帶來極其豐厚的「小人資源」，滿足內部對微縮生物的高漲需求。"
    gts_bruh_insurance_rate_2_desc: "執行標準偏高的保費方案，將保險費率上調至4%\n這一比例雖略低於極限壓榨，但對於微觀文明而言，短時間內失去大量人口仍是沉重的負擔。預期客戶社會內部會產生強烈的恐慌與不滿情緒，外交評估報告指出，長期維持此費率將持續侵蝕雙方信任基礎。雖然能確保大量資源流入，但需警惕潛在的違約行為，建議加強對該星球的武力威懾以確保合約履行。"
    gts_bruh_insurance_rate_3_desc: "維持標準的保費方案，將保險費率設定為2%\n這是一個精算後的折衷商業選擇，既能維持公司的基礎資源運作與巨娘員工的日常消耗需求，又不至於在短時間內徹底破壞客戶的社會再生產能力。客戶對此雖然懷有恐懼，但在絕對體型威懾下尚能維持基本的服從與運作。"
    gts_bruh_insurance_rate_4_desc: "採取象徵性的保費方案，僅徵收1%的人口作為象徵性保費。對於坐擁龐大人口基數的微觀文明而言，這一損失比例極低，甚至低於其自身因自然災害或疾病造成的自然傷亡率。這種相對寬鬆的策略極大紓解了客戶的生存壓力與恐慌感，有助於維持較高的信任度與良好的外交態度。雖然公司本週期獲得的實體生物資源減少，但穩定的客戶關係有利於長期的滲透與其他高附加值服務的推廣，符合長遠利益最大化模型。"
    gts_bruh_insurance_rate_5_desc: "暫停本週期的實物保費徵收。公司將以「市場推廣」、「特別恩典」或「人道主義關懷」的名義，全額豁免該星球的保費。這一反常的仁慈舉動將極大程度地消除其對巨娘企業的敵意。雖然本週期公司將無法從該客戶處獲得任何小人資源，且需自行承擔運營成本，但這將最大限度地提升外交態度。\n\n§Y(不會觸發保費繳交事件)§!"


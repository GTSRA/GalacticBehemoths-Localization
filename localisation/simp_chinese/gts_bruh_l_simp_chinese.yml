    pc_gts_juice_uncolonizable: "爱液星球"
    pc_gts_juice_uncolonizable_desc: "被巨娘塞进爱巢的可怜星球，汹涌的浪涛不断冲刷着其上的文明\n其大气中充满了催情气体，一切生活在其中的生物都处於24小时发情的状态。"

    pc_gts_bruh_white_hole: "白洞"
    pc_gts_bruh_white_hole_desc: "據說如果能穿過白洞就能到達§R巨娘居住的世界§!，但直到現在似乎也沒有人能做到完整地進入白洞。因為§Y$NAME_gts_eyjafjalla$§!瞬間注入的巨量乳汁，使得白洞的質量大增，發出的引力波比一般黑洞還強，更加干擾超光速引擎的工作，使戰艦難以緊急脫離戰鬥。"

    sc_gts_bruh_white_hole_star_classes: "白洞"
    sc_gts_bruh_white_hole_star_classes_desc: "據說如果能穿過白洞就能到達§R巨娘居住的世界§!，但直到現在似乎也沒有人能做到完整地進入白洞。因為§Y$NAME_gts_eyjafjalla$§!瞬間注入的巨量乳汁，使得白洞的質量大增，發出的引力波比一般黑洞還強，更加干擾超光速引擎的工作，使戰艦難以緊急脫離戰鬥。"

    sc_gts_bruh_aurora_star_classes: "歐若拉"
    sc_gts_bruh_aurora_star_classes_desc: ""

    pc_cheng_hui: "大紀久成惠"
    pc_cheng_hui_desc: ""

    # 胖次星球
    pc_gts_bruh_panties_planet_01: "胖次星球"
    pc_gts_bruh_panties_planet_01_adj: "胖次星球"
    pc_gts_bruh_panties_planet_01_desc: "这颗星球被完全包裹在一条从无畏舰娘身上脱下的巨大蓝白条纹内裤之中。原本的天空已被厚达数公里的棉质织物所取代，抬头望去，只能看见无边无际的白色与蓝色纤维交织而成的「天空」。地表常年处於湿热、阴暗的状态，空气中弥漫着令人窒息的氨味、汗味与女性下体特有的浓烈麝香味。自然降雨已不复存在，取而代之的是当上方的织物吸饱了体液後，滴落下来的粘稠爱液雨与变质的汗水。海洋已变成了浑浊的黄白色混合液体。"
    district_gts_bruh_panties_planet_01: "裤带城市"
    mod_pc_gts_bruh_panties_planet_01_habitability: "胖次星球宜居性"
    trait_pc_gts_bruh_panties_planet_01_preference: "胖次星球偏好"
    trait_pc_gts_bruh_panties_planet_01_preference_desc: "§L氣候偏好由基因決定的，通過長期進化或人工操縱形成。§!"
    col_gts_bruh_panties:"胖次世界"
    col_gts_bruh_panties_desc:"一个被从舰娘身上脱下的巨大内裤覆盖的星球。"
    col_gts_bruh_panties_tt:"原本的天空已被厚达数公里的织物取代，地表常年处於湿热阴暗的状态，殖民者在织物纤维间建立城市，开采尿渍结晶作为能源，在爱液沼泽中打捞各种残骸\n空气中混杂着汗味、氨味与女性特有的浓烈气息"
    district_gts_bruh_panties_planet_01_plural: "裤带城市"
    district_gts_bruh_panties_planet_01_desc: "位於高空的巨大环形山脉，实则是勒紧星球的松紧带结构。这里远离了底部的潮湿与异味，空气相对清新且乾燥。巨大的纤维如同天然的地基，为建筑提供了稳固的依托。"
    district_gts_bruh_panties_planet_02: "尿渍结晶发电区"
    district_gts_bruh_panties_planet_02_plural: "尿渍结晶发电区"
    district_gts_bruh_panties_planet_02_desc: "位於胖次前段的区域，通常是对应舰娘尿道口的位置。织物呈现出淡淡的黄色并已经硬化。这些「黄渍」中蕴含着巨娘排泄的高能化合物晶体。虽然开采过程伴随着令人窒息的氨气味，但燃烧这些晶体能提供惊人的能量，每一块晶体都浓缩了舰娘膀胱内的高能代谢废物。"
    district_gts_bruh_panties_planet_03: "爱液沼泽区"
    district_gts_bruh_panties_planet_03_plural: "爱液沼泽区"
    district_gts_bruh_panties_planet_03_desc: "位於胖次核心的区域，这里的织物常年湿润，形成了一片由爱液构成的沼泽。开采这里需要重型机械进行打捞，每一铲下去都能挖出各种残骸，那是无数个被舰娘塞入小穴内的星球残渣或船舰与爱液混合的产物。"
    district_gts_bruh_panties_planet_04: "棉线纤维矿区"
    district_gts_bruh_panties_planet_04_plural: "棉线纤维矿区"
    district_gts_bruh_panties_planet_04_desc: "这些如同通天巨塔般的棉质纤维是极佳的建筑材料。工人们攀爬在直径数公里的丝线上，开采这些坚韧的物质。当然，要小心别掉进纤维交织的深渊里，那里往往堆积着令人作呕的污垢。"

    d_gts_bruh_panties_planet_01_deposits: "尿酸黄晶矿床"
    d_gts_bruh_panties_planet_02_deposits: "拉丝爱液深潭"
    d_gts_bruh_panties_planet_03_deposits: "织物起球山脉"
    d_gts_bruh_panties_planet_04_deposits: "巨大的蝴蝶结"
    d_gts_bruh_panties_planet_05_deposits: "卷曲阴毛丛林"
    d_gts_bruh_panties_planet_06_deposits: "巨大洗涤标签"
    d_gts_bruh_panties_planet_07_deposits: "织物舰船残骸"
    d_gts_bruh_panties_planet_01_deposits_desc: "对应舰娘尿道口的织物区域呈现出硬化的深黄色。无数次排尿後残留的尿液在这里反覆乾燥、结晶，形成了坚硬的琥珀色矿脉。这些晶体散发着浓烈的氨气味道，只需轻轻敲击就能粉碎，从中提取出高纯度的化学原料，那是舰娘体内代谢出的精华。"
    d_gts_bruh_panties_planet_02_deposits_desc: "位於胖次正中央最湿润的凹陷处。这里是舰娘阴户直接接触的地方，积累了巨量的透明爱液。这些液体即使暴露在真空中也没有乾涸，而是形成了一片粘稠拉丝的湖泊，不断释放出令人头晕目眩的浓烈费洛蒙，任何掉进去的物体都会被死死黏住，最终沉入底部。"
    d_gts_bruh_panties_planet_03_deposits_desc: "由於舰娘大腿根部的频繁摩擦，这片区域的棉布纤维断裂并纠缠在一起，形成了高达数公里的巨型毛球。这些毛球内部结构松散，如同迷宫一般，同时吸附了大量的汗水和微小的污垢颗粒，是开采纺织原料的绝佳场所。"
    d_gts_bruh_panties_planet_04_deposits_desc: "位於胖次正前方的装饰性蝴蝶结，如今成为了一座宏伟的纪念碑，吸引着无数游客"
    d_gts_bruh_panties_planet_05_deposits_desc: "几根从舰娘私处脱落的黑色阴毛掉落在这里，对於小人来说，它们是横亘在地表上、粗达数公里且坚硬无比的卷曲黑色山脉。这些巨型阴毛阻断了交通，且难以切断"
    d_gts_bruh_panties_planet_06_deposits_desc: "胖次上的巨大洗涤标签，如同一座光滑的白色方尖碑耸立在大地上。上面印着「100%棉」的字样"
    d_gts_bruh_panties_planet_07_deposits_desc: "一些倒楣的舰队在胖次落下时没能逃脱，被硬生生压进了棉布的纤维里。这些镶嵌在天空(布料)中的战舰残骸成为了独特的矿藏"

    mod_district_gts_bruh_panties_planet_02_max_add: "最大$district_gts_bruh_panties_planet_02$"
    mod_district_gts_bruh_panties_planet_03_max_add: "最大$district_gts_bruh_panties_planet_03$"
    mod_district_gts_bruh_panties_planet_04_max_add: "最大$district_gts_bruh_panties_planet_04$"

    job_gts_bruh_panties_planet_01_worker: "尿晶礦工"
    job_gts_bruh_panties_planet_01_worker_with_icon: "£job_miner£$job_gts_bruh_panties_planet_01_worker$"
    job_gts_bruh_panties_planet_01_worker_plural: "$job_gts_bruh_panties_planet_01_worker$"
    job_gts_bruh_panties_planet_01_worker_plural_with_icon: "£job_miner£$job_gts_bruh_panties_planet_01_worker$"
    job_gts_bruh_panties_planet_01_worker_desc: "專門負責在黃漬區域開採硬化的尿液結晶。這些工人配備密封面罩以過濾空氣中的氨氣，使用震動鎬敲碎琥珀色的晶體層，將其送往煉製設施轉化為能源"
    job_gts_bruh_panties_planet_01_worker_effect_desc: "提供$energy$及$volatile_motes$產出"
    mod_job_gts_bruh_panties_planet_01_worker_add: "$job_gts_bruh_panties_planet_01_worker$崗位"
    mod_job_gts_bruh_panties_planet_01_worker_per_pop: "每$VALUE$人口§G+1§!$job_gts_bruh_panties_planet_01_worker$崗位"
    mod_job_gts_bruh_panties_planet_01_worker_per_pop_short: "\n每$VALUE$£pop£§G+1§!$mod_job_gts_bruh_panties_planet_01_worker_add$"
    job_gts_bruh_panties_planet_02_worker: "愛液打撈工"
    job_gts_bruh_panties_planet_02_worker_with_icon: "£job_pearl_diver£$job_gts_bruh_panties_planet_02_worker$"
    job_gts_bruh_panties_planet_02_worker_plural: "$job_gts_bruh_panties_planet_02_worker$"
    job_gts_bruh_panties_planet_02_worker_plural_with_icon: "£job_pearl_diver£$job_gts_bruh_panties_planet_02_worker$"
    job_gts_bruh_panties_planet_02_worker_desc: "操作重型机械在爱液沼泽中打捞残骸与爱液。这些工人需要极强的心理素质，因为每一铲挖出的都是粘稠拉丝的透明爱液，其中混杂着被碾碎的船舰碎片与星球残渣。打捞出的物质经过分离後可提取出资源"
    job_gts_bruh_panties_planet_02_worker_effect_desc: "提供$alloys$及$gts_giantess_fluid$产出"
    mod_job_gts_bruh_panties_planet_02_worker_add: "$job_gts_bruh_panties_planet_02_worker$岗位"
    mod_job_gts_bruh_panties_planet_02_worker_per_pop: "每$VALUE$人口§G+1§!$job_gts_bruh_panties_planet_02_worker$岗位"
    mod_job_gts_bruh_panties_planet_02_worker_per_pop_short: "\n每$VALUE$£pop£§G+1§!$mod_job_gts_bruh_panties_planet_02_worker_add$"
    job_gts_bruh_panties_planet_03_worker: "纖維採集工"
    job_gts_bruh_panties_planet_03_worker_with_icon: "£job_gts_giantess_underwear_worker£$job_gts_bruh_panties_planet_03_worker$"
    job_gts_bruh_panties_planet_03_worker_plural: "$job_gts_bruh_panties_planet_03_worker$"
    job_gts_bruh_panties_planet_03_worker_plural_with_icon: "£job_gts_giantess_underwear_worker£$job_gts_bruh_panties_planet_03_worker$"
    job_gts_bruh_panties_planet_03_worker_desc: "这些工人攀爬在直径数公里的棉质纤维上，使用特制的切割工具收割这些坚韧的材料。每日的工作都是在悬空数公里的高度进行的"
    job_gts_bruh_panties_planet_03_worker_effect_desc: "提供$gts_giantess_underwear$产出"
    mod_job_gts_bruh_panties_planet_03_worker_add: "$job_gts_bruh_panties_planet_03_worker$岗位"
    mod_job_gts_bruh_panties_planet_03_worker_per_pop: "每$VALUE$人口§G+1§!$job_gts_bruh_panties_planet_03_worker$岗位"
    mod_job_gts_bruh_panties_planet_03_worker_per_pop_short: "\n每$VALUE$£pop£§G+1§!$mod_job_gts_bruh_panties_planet_03_worker_add$"

    ################################################################################
    ######################                科技                ######################
    ################################################################################

    tech_gts_bruh_gts_planet_adaption: "巨娘星球适应"
    tech_gts_bruh_gts_planet_adaption_desc: "进一步研究其他行星上发现的危险环境有助於纾解殖民者在其他星球的日常生活中遇到的困难"

    ################################################################################
    ####################                建築與崗位                ####################
    ################################################################################

    building_gts_bruh_bruh_administrative_tower: "星河行政策略巨塔"
    building_gts_bruh_bruh_administrative_tower_desc: "這座直入雲霄的巨塔是整個帝國的行政核心，承載著層層疊疊的部門。巨娘官僚用她們比山還高的身軀在此處展開繁瑣的文書工作，一份文件可能就與一座小人圖書館一樣厚重，但對巨娘來說，只是拆閱一頁的日常工作"

    job_gts_bruh_megaclerk: "巨塔官僚"
    job_gts_bruh_megaclerk_plural: "$job_gts_bruh_megaclerk$"
    job_gts_bruh_megaclerk_desc: "這些巨娘官僚日以繼夜地處理帝國的文書與政令。雖然她們的工作重複冗長，但龐大的個體卻能在不知疲倦的狀態下處理巨量資訊，使帝國政務得以在數萬星系間流轉無礙\n\n該職位僅限§Y正常§!及以上特質的人口就職，§Y高大§!及以上特質的人口會有更高的就職權重"
    job_gts_bruh_megaclerk_effect_desc: "$job_gts_bruh_megaclerk$是巨娘崗位，消耗§Y$r_energy$§!、§Y$r_consumer_goods$§!產出\n§Y$r_unity$§!"
    mod_job_gts_bruh_megaclerk_add: "$job_gts_bruh_megaclerk$崗位"

    building_gts_bruh_giantess_fluid_1: "愛液熱力站"
    building_gts_bruh_giantess_fluid_1_desc: "這座發電站的數十座巨型儲存罐裝滿了從各地運來的巨娘愛液。這些透明而黏稠的液體始終保持著驚人的高溫，即使經過長途運輸也不會冷卻。工程師們設計了特殊的熱交換系統，讓這些滾燙的體液流經一層層金屬管道，將熱量傳遞給循環水系統。產生的大量蒸汽推動著巨大的渦輪機組，為整個星球提供穩定的電力。"
    job_gts_bruh_giantess_fluid_worker_1: "愛液機輪工"
    job_gts_bruh_giantess_fluid_worker_1_plural: "$job_gts_bruh_giantess_fluid_worker_1$"
    job_gts_bruh_giantess_fluid_worker_1_desc: "愛液機輪工的日常工作就是維護這些熱交換系統的正常運作。他們需要定期檢查管道是否有堵塞，因為愛液冷卻後會變得更加黏稠，容易在管壁上形成結晶。每天都要清理過濾網上積累的雜質，有時還能發現一些奇怪的東西，比如微小衣物纖維。"
    mod_job_gts_bruh_giantess_fluid_worker_1_add: "$job_gts_bruh_giantess_fluid_worker_1$崗位"
    mod_pop_gts_giantess_fluid_worker_1_workforce_mult: "$job_gts_bruh_giantess_fluid_worker_1_plural$$BONUS_WORKFORCE_FOR$"

    building_gts_bruh_giantess_fluid_2: "足汗打撈場"
    building_gts_bruh_giantess_fluid_2_desc: "這裡處理的是從巨娘腳底收集來的足汗和足垢混合物。巨大的分離池裡，液體在緩慢攪拌，表面漂浮著各種各樣的殘骸碎片。有些是被踩扁的戰艦殘骸，有些是建築物的碎塊，甚至還有完整的小型星球碎片。工人們操作著巨大的磁力吊臂，將這些殘骸從液體中撈出來，送往不同的處理區域。金屬類的送去熔煉，礦石類的送去提純，有機物則被焚燒發電。整個打撈場瀰漫著濃烈的腳臭味，即使是最先進的通風系統也無法完全消除。但這裡的產出相當可觀，經常能打撈到稀有的合金和礦物。"
    job_gts_bruh_giantess_fluid_worker_2: "足汗打撈工"
    job_gts_bruh_giantess_fluid_worker_2_plural: "$job_gts_bruh_giantess_fluid_worker_2$"
    job_gts_bruh_giantess_fluid_worker_2_desc: "足汗打撈工是這個星球上最辛苦的職業之一。穿著全身防護服，在散發著刺鼻氣味的池子邊工作，用特製的工具將各種殘骸從黏稠的液體中撈出。最難的是判斷哪些東西有價值，哪些只是普通垃圾。經驗豐富的打撈工能從一塊金屬的光澤判斷它的成分，從殘骸的形狀推測它的來源。有時候會發現一些稀奇古怪的東西，比如還在運作的機械裝置，或是保存完好的文物。工作環境雖然惡劣，但收入不錯，而且經常有意外之喜。"
    mod_job_gts_bruh_giantess_fluid_worker_2_add: "$job_gts_bruh_giantess_fluid_worker_2$崗位"
    mod_pop_gts_giantess_fluid_worker_2_workforce_mult: "$job_gts_bruh_giantess_fluid_worker_2_plural$$BONUS_WORKFORCE_FOR$"

    building_gts_bruh_giantess_fluid_3: "乳汁灌溉農場"
    building_gts_bruh_giantess_fluid_3_desc: "農場的中心是幾座巨大的白色儲罐，裡面儲存著從各地運來的巨娘乳汁。這些乳白色的液體富含各種營養成分，是最好的天然肥料。技術人員按照精確的比例將乳汁與清水混合，再通過遍布農場的管道系統輸送到每一塊農田。田地裡的作物長得格外茂盛，玉米杆比普通品種高出一倍，麥穗沉甸甸地垂下來。農場上空經常能看到淡淡的乳霧，整個農場瀰漫著甜甜的奶香，讓人聞了就覺得餓。"
    job_gts_bruh_giantess_fluid_worker_3: "乳汁農工"
    job_gts_bruh_giantess_fluid_worker_3_plural: "$job_gts_bruh_giantess_fluid_worker_3$"
    job_gts_bruh_giantess_fluid_worker_3_desc: "乳汁農工的主要工作是操作灌溉系統，確保每塊農田都能得到適量的乳汁供應。也需每天檢查管道是否暢通，因為乳汁容易在管壁上形成乳垢，需要定期清理。"
    mod_job_gts_bruh_giantess_fluid_worker_3_add: "$job_gts_bruh_giantess_fluid_worker_3$崗位"
    mod_pop_gts_giantess_fluid_worker_3_workforce_mult: "$job_gts_bruh_giantess_fluid_worker_3_plural$$BONUS_WORKFORCE_FOR$"

    building_gts_bruh_micro_1: "小人熱能爐"
    building_gts_bruh_micro_1_desc: "這座建築從外表看平平無奇，只是一棟普通的方形大樓，但內部卻是另一番景象。空間裡密密麻麻地排列著無數個透明的小膠囊，每個膠囊裡都裝著一個活生生的小人。這些小人被固定在特製的座椅上，身上貼滿了導熱貼片。他們的體溫通過膠囊壁被收集起來，匯聚成穩定的熱流，再轉化為電能。$job_gts_bruh_micro_worker_1$推著小車走進膠囊陣列之間，用鑷子小心翼翼地夾起那些活動力已經下降的膠囊。每個膠囊都有編號，電腦系統實時監控著每一個小人的狀態。雖然技術上很先進，但這裡的氣氛總讓人覺得壓抑。"
    job_gts_bruh_micro_worker_1: "熱能管理員"
    job_gts_bruh_micro_worker_1_plural: "$job_gts_bruh_micro_worker_1$"
    job_gts_bruh_micro_worker_1_desc: "$job_gts_bruh_micro_worker_1$每天的工作就是巡視這些膠囊，確保每個小人都在正常產熱。他們手持平板電腦，上面顯示著每個膠囊的溫度數據。如果發現某個膠囊的溫度異常，就要立即處理。有時是膠囊故障，有時是小人生病了，還有時是小人已經死了。管理員會打開膠囊，把裡面的小人取出來，然後直接更換新的。這份工作最大的好處就是可以處置那些無法使用的小人，許多$job_gts_bruh_micro_worker_1$會把他們帶回家當玩具或零食。工作雖然單調，但很穩定，而且福利不錯。"
    mod_job_gts_bruh_micro_worker_1_add: "$job_gts_bruh_micro_worker_1$崗位"
    mod_pop_gts_micro_worker_1_workforce_mult: "$job_gts_bruh_micro_worker_1_plural$$BONUS_WORKFORCE_FOR$"

    building_gts_bruh_micro_2: "小人篩礦場"
    building_gts_bruh_micro_2_desc: "這座礦場專門處理那些巨娘們看不上的礦渣和廢料。對巨娘來說太小的礦物碎屑，對小人來說卻是寶貴的資源。整個礦場分為多個區域，每個區域堆放著不同來源的廢料。有些是採礦剩下的碎石，有些是冶煉後的爐渣，還有些是拆船廠的金屬碎片。成千上萬的小人在這些廢料堆裡工作，用他們的小手一點點篩選出有價值的東西。礦場上空總是灰濛濛的，空氣中飄浮著細小的粉塵。"
    job_gts_bruh_micro_worker_2: "巨娘篩礦場監工"
    job_gts_bruh_micro_worker_2_plural: "$job_gts_bruh_micro_worker_2$"
    job_gts_bruh_micro_worker_2_desc: "$job_gts_bruh_micro_worker_2$的工作是確保這些小人高效工作，不偷懶也不偷東西。$job_gts_bruh_micro_worker_2$隨時可以對偷懶的小人發出警告。如果警告無效，她們會毫不猶豫地在所有小人前把那個倒楣蛋踩成肉醬。這種殺雞儆猴的做法非常有效，小人們都拼命工作，生怕成為下一個例子。$job_gts_bruh_micro_worker_2$的收入與礦場的產出掛鉤，所以她們對工作非常認真。下班後，她們經常會帶幾個表現好的小人回家"獎勵"。"
    mod_job_gts_bruh_micro_worker_2_add: "$job_gts_bruh_micro_worker_2$崗位"
    mod_pop_gts_micro_worker_2_workforce_mult: "$job_gts_bruh_micro_worker_2_plural$$BONUS_WORKFORCE_FOR$"

    building_gts_bruh_micro_3: "小人食品加工中心"
    building_gts_bruh_micro_3_desc: "這座工廠是所有小人的噩夢。運輸車將一批批小人送到這裡，他們被倒進巨大的分揀機器裡，按照身高、體重、健康狀況分成不同等級。最健康強壯的被送往鮮食生產線，他們會被簡單清洗後直接包裝出售。體質較弱的被送往加工線，在那裡被處理成各種食品。工廠的不同區域負責生產不同的產品，有的做罐頭，有的做醃製品，有的做乾貨。整個工廠迴盪著機器的轟鳴聲和小人的尖叫聲，但這些聲音很快就被淹沒在流水線的噪音裡。成品被裝箱運往各地，供巨娘們享用。"
    job_gts_bruh_micro_worker_3: "小人食品加工師"
    job_gts_bruh_micro_worker_3_plural: "$job_gts_bruh_micro_worker_3$"
    job_gts_bruh_micro_worker_3_desc: "$job_gts_bruh_micro_worker_3$負責操作各種加工設備，將小人製成不同的食品。有些產品需要將小人切碎攪拌，有些需要整個醃製，有些需要烘乾研磨。$job_gts_bruh_micro_worker_3$必須熟練掌握各種工藝，確保產品的口感和品質。她們經常要試吃新產品，評估味道是否達標。工作雖然有點血腥，但待遇很好，而且經常有免費的小人食品帶回家。"
    mod_job_gts_bruh_micro_worker_3_add: "$job_gts_bruh_micro_worker_3$崗位"
    mod_pop_gts_micro_worker_3_workforce_mult: "$job_gts_bruh_micro_worker_3_plural$$BONUS_WORKFORCE_FOR$"

